name: File 00 1.2.17 Fourth-Fresh-Ten-Review QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build, test and verify File 00 source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none
          tools: none
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - name: Exact fourth-fresh review and governing traceability
        run: |
          set -euo pipefail
          grep -Fq 'Version: 1.2.17' source/sabri-membership-core/sabri-membership-core.php
          grep -Fq '"version": "1.2.17"' package.json
          test "$(node -p "require('./package-lock.json').version")" = '1.2.17'
          test "$(node -p "require('./package-lock.json').packages[''].version")" = '1.2.17'
          grep -Fq "define( 'SMC_CONTRACT_VERSION', '1.2.0' )" source/sabri-membership-core/sabri-membership-core.php
          grep -Fq "define( 'SMC_ADVANCED_TRUST_CONTRACT_VERSION', '1.0.0' )" source/sabri-membership-core/sabri-membership-core.php
          node qa/fourth-fresh-review-contract.mjs
          test -f dist/00-sabri-membership-core-1.2.17.zip
          test -z "$(git ls-files 'dist/*')"
          grep -Fq 'Runtime implementation release: `1.2.17`' docs/FILE-00-MASTER-PLAN-2026.md
          grep -Fq 'Total: **8 unique defects; corrected 8/8**.' docs/FILE-00-FOURTH-FRESH-TEN-ROUND-REVIEW-1.2.17.md
          test -f docs/FILE-00-THIRD-FRESH-TEN-ROUND-REVIEW-1.2.16.md
          python3 - <<'PY'
          import json
          d=json.load(open('qa/fourth-fresh-ten-review-traceability.json'))
          assert d['release']=='1.2.17'
          assert d['review_complete'] is True
          assert d['rounds_with_defects']==[1,2,3,4,5,9,10]
          assert d['rounds_without_defects']==[6,7,8]
          assert d['defects_found_total']==8 and d['defects_corrected_total']==8
          assert d['severity']=={'critical':1,'high':3,'medium':4,'low':0}
          assert d['known_unresolved_repository_defects']==0
          assert d['guardrails']['self_mutating_ci'] is False
          assert d['guardrails']['fourth_fresh_regressions_permanent'] is True
          assert d['guardrails']['lockfile_matches_runtime'] is True
          assert d['external_status']=={'staging_accepted':False,'live_deployed':False,'operational':False}
          PY
          grep -Fq '#087A4E' source/sabri-membership-core/assets/membership.css
          ! grep -RInE '^\s*contents:\s*write\s*$' .github/workflows
          test ! -e tools/apply-fourth-fresh-ten-review.py
          test ! -e tools/fix-fourth-static.py
          test ! -e .github/workflows/apply-fourth-fresh-ten-review.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 00-sabri-membership-core-1.2.17-${{ github.sha }}
          path: |
            dist/00-sabri-membership-core-1.2.17.zip
            dist/CHECKSUMS.sha256
            docs/RELEASE-1.2.17-FOURTH-FRESH-TEN-REVIEW.md
            docs/FILE-00-FOURTH-FRESH-TEN-ROUND-REVIEW-1.2.17.md
            docs/FILE-00-THIRD-FRESH-TEN-ROUND-REVIEW-1.2.16.md
            docs/FILE-00-SECOND-FRESH-TEN-ROUND-REVIEW-1.2.15.md
            docs/FILE-00-LATEST-CENTRAL-TRACEABILITY-1.2.12.md
            qa/fourth-fresh-ten-review-traceability.json
            qa/third-fresh-ten-review-traceability.json
            qa/second-fresh-ten-review-traceability.json
            qa/advanced-trust-traceability.json
            qa/latest-central-traceability.json
          if-no-files-found: error
          retention-days: 30

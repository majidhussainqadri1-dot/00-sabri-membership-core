name: Finalize File 00 Three-Plan Evidence 1.2.11

on:
  push:
    branches: ['codex/file00-forty-review-cycles-1.2.10']
    paths:
      - 'tools/finalize-three-plan-evidence-1.2.11.py'
      - '.github/workflows/finalize-three-plan-evidence-1.2.11.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/file00-forty-review-cycles-1.2.10
          fetch-depth: 0
      - run: python3 tools/finalize-three-plan-evidence-1.2.11.py
      - name: Commit post-CI evidence
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'File 00 1.2.11: record successful three-plan evidence'
          git push origin HEAD:codex/file00-forty-review-cycles-1.2.10

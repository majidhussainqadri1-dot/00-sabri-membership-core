name: File 00 Eighth Fresh Ten-Round Corrective Applicator

on:
  push:
    branches:
      - codex/file00-eighth-fresh-ten-review-1.2.21
    paths:
      - .github/workflows/file00-eighth-review-one-shot.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/file00-eighth-fresh-ten-review-1.2.21
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none
          tools: none
      - name: Configure review identity
        run: |
          git config user.name "File 00 Review Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Apply ten independent review-fix-retest rounds
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, pathlib, re, zlib
          wrapper=pathlib.Path('tools/file00_eighth_review_bootstrap.py').read_text(encoding='utf-8')
          m=re.search(r"b64decode\('([^']+)'\)",wrapper)
          if not m: raise SystemExit('embedded review payload not found')
          code=zlib.decompress(base64.b64decode(m.group(1))).decode('utf-8')
          start=code.find('# R6 — retry overdue audit/revocation propagation even when hold is already present.')
          end=code.find('# R7 — Founder/Admin authority never bypasses operational state; service-identity change uses adaptive step-up.')
          if start < 0 or end <= start: raise SystemExit('round-six applicator section not found')
          corrected='''# R6 — retry overdue audit/revocation propagation even when hold is already present.\nold="""\\t\\t\\t$status = self::reverification_status( $user_id );\\n\\t\\t\\tif ( ! empty( $status['overdue'] ) && ! get_user_meta( $user_id, '_smc_reverification_required', true ) ) {\\n\\t\\t\\t\\tif ( ! self::write_user_meta_verified( $user_id, '_smc_reverification_required', 1 )\\n\\t\\t\\t\\t\\t|| ! SMC_Security::audit( 'membership_reverification_overdue', $user_id, array( 'due_at' => absint( $status['due_at'] ?? 0 ) ) )\\n\\t\\t\\t\\t\\t|| false === self::bump_revocation_epoch( $user_id, 'membership_reverification_overdue' ) ) {\\n\\t\\t\\t\\t\\tself::write_option_verified( self::REVERIFY_CURSOR_OPTION, $cursor );\\n\\t\\t\\t\\t\\treturn;\\n\\t\\t\\t\\t}\\n\\t\\t\\t}\\n"""\nnew="""\\t\\t\\t$status = self::reverification_status( $user_id );\\n\\t\\t\\tif ( ! empty( $status['overdue'] ) ) {\\n\\t\\t\\t\\t$due_at = absint( $status['due_at'] ?? 0 );\\n\\t\\t\\t\\t$propagated_due_at = absint( get_user_meta( $user_id, '_smc_reverification_overdue_propagated_due_at', true ) );\\n\\t\\t\\t\\tif ( ! get_user_meta( $user_id, '_smc_reverification_required', true ) && ! self::write_user_meta_verified( $user_id, '_smc_reverification_required', 1 ) ) { self::write_option_verified( self::REVERIFY_CURSOR_OPTION, $cursor ); return; }\\n\\t\\t\\t\\tif ( $due_at > 0 && $propagated_due_at < $due_at ) {\\n\\t\\t\\t\\t\\tif ( ! SMC_Security::audit( 'membership_reverification_overdue', $user_id, array( 'due_at' => $due_at ) ) || false === self::bump_revocation_epoch( $user_id, 'membership_reverification_overdue' ) || ! self::write_user_meta_verified( $user_id, '_smc_reverification_overdue_propagated_due_at', $due_at ) ) { self::write_option_verified( self::REVERIFY_CURSOR_OPTION, $cursor ); return; }\\n\\t\\t\\t\\t}\\n\\t\\t\\t}\\n"""\nrepl(A,old,new)\nlint(A); assert_text(A,present=("_smc_reverification_overdue_propagated_due_at","$propagated_due_at < $due_at"))\ncommit('Review 6: make overdue reverification propagation retryable',[str(A.relative_to(ROOT))])\n\n'''
          code=code[:start]+corrected+code[end:]
          needle="        ('runtime 1.2.20','runtime 1.2.21'),\n"
          if needle not in code: raise SystemExit('active runtime fixture synchronization marker not found')
          code=code.replace(needle,needle+"        ('Runtime implementation release: `1.2.20`','Runtime implementation release: `1.2.21`'),\n",1)
          exec(compile(code,'file00_eighth_review_apply.py','exec'),{'__name__':'__main__'})
          PY

name: Temporary File 00 v1.2.38 Authorized Correction

on:
  push:
    branches:
      - fix/live-admin-role-backfill-v1.2.38
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/live-admin-role-backfill-v1.2.38
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none
          tools: none

      - name: Install QA dependencies
        run: npm ci --ignore-scripts

      - name: Apply exact live-proven correction
        run: python3 tools/_temporary_apply_v1238.py

      - name: Build and run inherited QA
        run: |
          python3 tools/build.py
          npm test
          python3 qa/verify-package.py dist/00-sabri-membership-core-1.2.38.zip

      - name: Commit verified candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "File 00 1.2.38: repair live Administrator role-grant backfill"
          git push origin HEAD:fix/live-admin-role-backfill-v1.2.38

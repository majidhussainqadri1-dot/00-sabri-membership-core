name: Temporary File 00 1.2.44 Release Apply

on:
  push:
    branches:
      - fix/file00-account-taxonomy-provider-parity-1.2.44

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Apply frozen release correction
        run: |
          set -euo pipefail
          python3 tools/apply-file00-1244.py
          git diff --check
      - name: Full repository verification before commit
        run: |
          set -euo pipefail
          find source/sabri-membership-core -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          node qa/file02-account-contract-v1243.mjs
          php qa/file02-account-contract-runtime-v1243.php
          node qa/file00-1244-taxonomy-release.mjs
          npm ci --ignore-scripts
          npm run verify
          git diff --check
      - name: Record completion evidence
        run: |
          set -euo pipefail
          cat > REVIEW-1.2.44-TAXONOMY-COMPLETION.md <<'EOF'
          # File 00 — 1.2.44 Taxonomy/Provider Parity Correction Evidence

          The 1.2.44 release correction was applied only after `REVIEW-1.2.44-TAXONOMY-FROZEN.md` froze the review findings.

          Before commit, all plugin PHP lint passed, focused File 02 account-contract source/runtime QA passed, the permanent File 00 1.2.44 taxonomy/release regression passed, and `npm run verify` completed the deterministic build plus full repository QA/package verification.

          File 02 is exact-pinned at `950f4bd3f63e08304e3afafa501196919223ab20` / runtime `1.2.4` in the permanent compatibility gate. Runtime File 00 identity is `1.2.44`; DB remains `1.4.5`; public membership contract remains `1.2.3`; `smc.authentication-account` remains `1.1.0`.

          This is repository/source evidence only. Exact deployed code ابھی unverified ہے؛ repository-based diagnosis provisional ہے۔
          EOF
          sed -i 's/^          //' REVIEW-1.2.44-TAXONOMY-COMPLETION.md
          git diff --check
      - name: Commit exact tested candidate
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name 'majidhussainqadri1-dot'
          git config user.email 'majidhussainqadri1@gmail.com'
          git commit -m 'File00 1.2.44: canonical taxonomy provider parity and File02 1.2.4 exact pin'
          git push origin HEAD:fix/file00-account-taxonomy-provider-parity-1.2.44

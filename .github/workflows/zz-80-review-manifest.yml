name: File 00 Review80 Manifest Regenerator

on:
  push:
    branches: [audit/80-round-review-v1.2.40]

permissions:
  contents: read

jobs:
  regenerate-manifest:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Regenerate source manifest
        run: python3 tools/build.py
      - name: Upload regenerated manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: review80-regenerated-manifest
          path: source/sabri-membership-core/MANIFEST.sha256
          if-no-files-found: error
          retention-days: 1

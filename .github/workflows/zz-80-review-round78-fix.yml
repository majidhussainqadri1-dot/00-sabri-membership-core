name: File 00 80-Review Round 78 Immediate Fix

on:
  push:
    branches: [audit/80-round-review-v1.2.40]
    paths: [.github/workflows/zz-80-review-round78-fix.yml]

permissions:
  contents: write

jobs:
  apply-round-78:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: audit/80-round-review-v1.2.40
          fetch-depth: 0
      - name: Make institutional repair sweep starvation-safe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('source/sabri-membership-core/includes/class-smc-lifecycle.php')
          s=p.read_text()
          s=s.replace("\tprivate const INSTITUTIONAL_AGE_META = '_smc_institutional_age_evidence_attention';\n", "\tprivate const INSTITUTIONAL_AGE_META = '_smc_institutional_age_evidence_attention';\n\tprivate const INSTITUTIONAL_REPAIR_CURSOR_OPTION = 'smc_institutional_repair_cursor';\n")
          old="""\tpublic static function repair_institutional_accounts() {\n\t\tglobal $wpdb;\n\t\tself::$repair_failures = 0;\n\t\t$rows = $wpdb->get_results(\n\t\t\t\"SELECT * FROM {$wpdb->prefix}smc_applications WHERE status='suspended' ORDER BY id ASC LIMIT 500\",\n\t\t\tARRAY_A\n\t\t);\n\t\t$repaired = 0;\n\t\tforeach ( $rows as $app ) {\n\t\t\t$user_id = (int) $app['user_id'];\n\t\t\tif ( ! self::is_institutional_user( $user_id ) || self::has_unresolved_manual_hard_block( $user_id ) ) {\n\t\t\t\tcontinue;\n\t\t\t}\n\t\t\t$context = self::latest_hard_block_context( $user_id );\n\t\t\tif ( 'membership_restricted' !== $context['action'] || self::AUTOMATED_AGE_REASON !== $context['reason'] ) {\n\t\t\t\tcontinue;\n\t\t\t}\n\t\t\tif ( self::repair_institutional_account( $app ) ) {\n\t\t\t\t++$repaired;\n\t\t\t} else {\n\t\t\t\t++self::$repair_failures;\n\t\t\t}\n\t\t}\n\t\treturn $repaired;\n\t}\n"""
          new="""\tpublic static function repair_institutional_accounts() {\n\t\tglobal $wpdb;\n\t\tself::$repair_failures = 0;\n\t\t$cursor = absint( get_option( self::INSTITUTIONAL_REPAIR_CURSOR_OPTION, 0 ) );\n\t\t$rows = $wpdb->get_results(\n\t\t\t$wpdb->prepare(\n\t\t\t\t\"SELECT * FROM {$wpdb->prefix}smc_applications WHERE status='suspended' AND id>%d ORDER BY id ASC LIMIT 500\",\n\t\t\t\t$cursor\n\t\t\t),\n\t\t\tARRAY_A\n\t\t);\n\t\t$repaired = 0;\n\t\tforeach ( $rows as $app ) {\n\t\t\t$cursor = (int) $app['id'];\n\t\t\t$user_id = (int) $app['user_id'];\n\t\t\tif ( ! self::is_institutional_user( $user_id ) || self::has_unresolved_manual_hard_block( $user_id ) ) {\n\t\t\t\tcontinue;\n\t\t\t}\n\t\t\t$context = self::latest_hard_block_context( $user_id );\n\t\t\tif ( 'membership_restricted' !== $context['action'] || self::AUTOMATED_AGE_REASON !== $context['reason'] ) {\n\t\t\t\tcontinue;\n\t\t\t}\n\t\t\tif ( self::repair_institutional_account( $app ) ) {\n\t\t\t\t++$repaired;\n\t\t\t} else {\n\t\t\t\t++self::$repair_failures;\n\t\t\t}\n\t\t}\n\t\t$next_cursor = count( $rows ) < 500 ? 0 : $cursor;\n\t\tupdate_option( self::INSTITUTIONAL_REPAIR_CURSOR_OPTION, $next_cursor, false );\n\t\treturn $repaired;\n\t}\n"""
          if old not in s: raise SystemExit('institutional repair block not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Verify round 78 correction
        run: |
          set -euo pipefail
          php -l source/sabri-membership-core/includes/class-smc-lifecycle.php
          grep -q "INSTITUTIONAL_REPAIR_CURSOR_OPTION" source/sabri-membership-core/includes/class-smc-lifecycle.php
          grep -q "status='suspended' AND id>%d ORDER BY id ASC LIMIT 500" source/sabri-membership-core/includes/class-smc-lifecycle.php
          grep -q "count( \$rows ) < 500 ? 0 : \$cursor" source/sabri-membership-core/includes/class-smc-lifecycle.php
          git diff --check
      - name: Commit immediate round 78 correction
        run: |
          set -euo pipefail
          git config user.name 'File 00 QA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add source/sabri-membership-core/includes/class-smc-lifecycle.php
          git commit -m 'Round 78: prevent institutional repair starvation beyond first 500 rows'
          git push origin HEAD:audit/80-round-review-v1.2.40

name: File 00 80-Review Round 59 Immediate Fix

on:
  push:
    branches: [audit/80-round-review-v1.2.40]
    paths: [.github/workflows/zz-80-review-round59-fix.yml]

permissions:
  contents: write

jobs:
  apply-round-59:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: audit/80-round-review-v1.2.40
          fetch-depth: 0
      - name: Contain repair adapter failures and preserve retry state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('source/sabri-membership-core/includes/class-smc-completion.php')
          s=p.read_text()
          old="""\t\t\t$details = json_decode( (string) $row['details'], true );\n\t\t\t$resolved = (bool) apply_filters( 'smc_repair_application_item', false, $row, is_array( $details ) ? $details : array() );\n\t\t\tif ( ! $resolved && 'application_document_incomplete' === $row['repair_type'] ) { $resolved = self::application_documents_complete( (int) $row['user_id'] ); }\n\t\t\tif ( ! $resolved && 'membership_effects_reconciliation' === $row['repair_type'] ) { $resolved = self::reconcile_membership_effects( (int) $row['user_id'] ); }\n\t\t\tif ( ! $resolved && 'advanced_trust_transition' === $row['repair_type'] && class_exists( 'SMC_Advanced_Trust_2026' ) ) { $resolved = SMC_Advanced_Trust_2026::repair_transition_hold( (int) $row['user_id'] ); }\n\t\t\tif ( $resolved ) {\n"""
          new="""\t\t\t$details = json_decode( (string) $row['details'], true );\n\t\t\t$resolved = false;\n\t\t\t$repair_error = '';\n\t\t\ttry {\n\t\t\t\t$resolved = (bool) apply_filters( 'smc_repair_application_item', false, $row, is_array( $details ) ? $details : array() );\n\t\t\t\tif ( ! $resolved && 'application_document_incomplete' === $row['repair_type'] ) { $resolved = self::application_documents_complete( (int) $row['user_id'] ); }\n\t\t\t\tif ( ! $resolved && 'membership_effects_reconciliation' === $row['repair_type'] ) { $resolved = self::reconcile_membership_effects( (int) $row['user_id'] ); }\n\t\t\t\tif ( ! $resolved && 'advanced_trust_transition' === $row['repair_type'] && class_exists( 'SMC_Advanced_Trust_2026' ) ) { $resolved = SMC_Advanced_Trust_2026::repair_transition_hold( (int) $row['user_id'] ); }\n\t\t\t} catch ( Throwable $error ) {\n\t\t\t\t$resolved = false;\n\t\t\t\t$repair_error = 'Repair adapter raised an exception; retry is required.';\n\t\t\t}\n\t\t\tif ( $resolved ) {\n"""
          if old not in s: raise SystemExit('repair resolution block not found')
          s=s.replace(old,new)
          old2="""\t\t\t\t$wpdb->query( $wpdb->prepare( \"UPDATE {$wpdb->prefix}smc_application_repairs SET status=%s,next_attempt_at=%s,last_error=%s,updated_at=%s WHERE id=%d AND status='processing'\", $status, gmdate( 'Y-m-d H:i:s', time() + min( DAY_IN_SECONDS, (int) pow( 2, min( 10, $attempts ) ) * MINUTE_IN_SECONDS ) ), 'The repair condition is still unresolved.', current_time( 'mysql', true ), (int) $row['id'] ) );\n"""
          new2="""\t\t\t\t$last_error = '' !== $repair_error ? $repair_error : 'The repair condition is still unresolved.';\n\t\t\t\t$wpdb->query( $wpdb->prepare( \"UPDATE {$wpdb->prefix}smc_application_repairs SET status=%s,next_attempt_at=%s,last_error=%s,updated_at=%s WHERE id=%d AND status='processing'\", $status, gmdate( 'Y-m-d H:i:s', time() + min( DAY_IN_SECONDS, (int) pow( 2, min( 10, $attempts ) ) * MINUTE_IN_SECONDS ) ), $last_error, current_time( 'mysql', true ), (int) $row['id'] ) );\n"""
          if old2 not in s: raise SystemExit('repair retry update block not found')
          p.write_text(s.replace(old2,new2))
          PY
      - name: Verify round 59 correction
        run: |
          set -euo pipefail
          php -l source/sabri-membership-core/includes/class-smc-completion.php
          grep -q "Repair adapter raised an exception; retry is required." source/sabri-membership-core/includes/class-smc-completion.php
          grep -q "catch ( Throwable \$error )" source/sabri-membership-core/includes/class-smc-completion.php
          git diff --check
      - name: Commit immediate round 59 correction
        run: |
          git config user.name 'File 00 QA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add source/sabri-membership-core/includes/class-smc-completion.php
          git commit -m 'Round 59: contain repair adapter failures for controlled replay'
          git push origin HEAD:audit/80-round-review-v1.2.40

name: Review10 Round5 Repair Completion Regression
on:
  push:
    branches: ['audit/80-round-review-v1.2.40']
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: audit/80-round-review-v1.2.40
          fetch-depth: 0
      - name: Strengthen exact regression
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('qa/review80-wordpress-mysql.php')
          s=p.read_text()
          old="""\t$previous_cursor = 0;\n\t$progress_ok = true;\n\t$repaired = false;\n\t$max_batches = max( 3, (int) ceil( $eligible_suspended / 500 ) + 2 );\n\tfor ( $attempt = 1; $attempt <= $max_batches; $attempt++ ) {\n\t\tSMC_Lifecycle::repair_institutional_accounts();\n\t\t$current = smc_application( $admin_user );\n\t\tif ( $current && 'suspended' !== ( $current['status'] ?? '' ) ) {\n\t\t\t$repaired = true;\n\t\t\tbreak;\n\t\t}\n\t\t$cursor = (int) get_option( $cursor_option, 0 );\n\t\tif ( 0 === $cursor || $cursor <= $previous_cursor ) {\n\t\t\t$progress_ok = false;\n\t\t\tbreak;\n\t\t}\n\t\t$previous_cursor = $cursor;\n\t}\n\t$check( $progress_ok, 'institutional repair cursor advances monotonically while additional batches remain' );\n\t$check( $repaired, 'institutional repair cursor reaches and repairs later eligible institutional row without starvation' );\n"""
          new="""\t$previous_cursor = 0;\n\t$progress_ok = true;\n\t$repaired = false;\n\t$premature_complete = false;\n\t$max_batches = max( 3, (int) ceil( $eligible_suspended / 500 ) + 2 );\n\tfor ( $attempt = 1; $attempt <= $max_batches; $attempt++ ) {\n\t\tSMC_Lifecycle::repair_institutional_accounts();\n\t\t$current = smc_application( $admin_user );\n\t\tif ( $current && 'suspended' !== ( $current['status'] ?? '' ) ) {\n\t\t\t$repaired = true;\n\t\t\tbreak;\n\t\t}\n\t\tif ( SMC_Lifecycle::institutional_repair_complete() ) {\n\t\t\t$premature_complete = true;\n\t\t}\n\t\t$cursor = (int) get_option( $cursor_option, 0 );\n\t\tif ( 0 === $cursor || $cursor <= $previous_cursor ) {\n\t\t\t$progress_ok = false;\n\t\t\tbreak;\n\t\t}\n\t\t$previous_cursor = $cursor;\n\t}\n\t$check( ! $premature_complete, 'institutional repair is not marked complete before cursor exhaustion' );\n\t$check( $progress_ok, 'institutional repair cursor advances monotonically while additional batches remain' );\n\t$check( $repaired, 'institutional repair cursor reaches and repairs later eligible institutional row without starvation' );\n\t$check( $repaired && SMC_Lifecycle::institutional_repair_complete(), 'institutional repair becomes complete only after the terminal batch' );\n"""
          if old not in s:
              raise SystemExit('expected starvation regression block not found; refusing broad patch')
          p.write_text(s.replace(old,new,1))
          PY
          php -l qa/review80-wordpress-mysql.php
          rm .github/workflows/zz-review10-round5-test-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/review80-wordpress-mysql.php .github/workflows/zz-review10-round5-test-patch.yml
          git commit -m 'Round 5: assert repair completion only after cursor exhaustion'
          git push origin HEAD:audit/80-round-review-v1.2.40

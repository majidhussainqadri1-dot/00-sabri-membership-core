name: File 00 80-Review Round 63 Immediate Fix

on:
  push:
    branches: [audit/80-round-review-v1.2.40]
    paths: [.github/workflows/zz-80-review-round63-fix.yml]

permissions:
  contents: write

jobs:
  apply-round-63:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: audit/80-round-review-v1.2.40
          fetch-depth: 0
      - name: Add bounded session cleanup indexes and DB contract 1.4.5
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('source/sabri-membership-core')

          p=root/'sabri-membership-core.php'; s=p.read_text()
          if "define( 'SMC_DB_VERSION', '1.4.4' );" not in s: raise SystemExit('current DB version marker missing')
          p.write_text(s.replace("define( 'SMC_DB_VERSION', '1.4.4' );", "define( 'SMC_DB_VERSION', '1.4.5' );"))

          p=root/'includes/class-smc-installer.php'; s=p.read_text()
          old="""\t\t\tUNIQUE KEY token_hash (token_hash),\n\t\t\tKEY user_active (user_id,revoked_at)\n"""
          new="""\t\t\tUNIQUE KEY token_hash (token_hash),\n\t\t\tKEY user_active (user_id,revoked_at),\n\t\t\tKEY expires_at (expires_at),\n\t\t\tKEY revoked_at (revoked_at)\n"""
          if old not in s: raise SystemExit('auth session index marker missing')
          p.write_text(s.replace(old,new))

          p=root/'includes/class-smc-schema-compat.php'; s=p.read_text()
          marker="\t\tif ( $wanted !== $actual ) {\n\t\t\tthrow new RuntimeException( 'Current approval decision index columns are invalid.' );\n\t\t}\n\n\t\treturn true;\n"
          insertion="""\t\tif ( $wanted !== $actual ) {\n\t\t\tthrow new RuntimeException( 'Current approval decision index columns are invalid.' );\n\t\t}\n\n\t\t$session_table = $wpdb->prefix . 'smc_auth_sessions';\n\t\tforeach ( array( 'expires_at', 'revoked_at' ) as $index_name ) {\n\t\t\t$rows = $wpdb->get_results(\n\t\t\t\t$wpdb->prepare(\n\t\t\t\t\t\"SELECT SEQ_IN_INDEX,COLUMN_NAME,SUB_PART,NON_UNIQUE,INDEX_TYPE FROM information_schema.STATISTICS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME=%s AND INDEX_NAME=%s ORDER BY SEQ_IN_INDEX\",\n\t\t\t\t\t$session_table,\n\t\t\t\t\t$index_name\n\t\t\t\t),\n\t\t\t\tARRAY_A\n\t\t\t);\n\t\t\tif ( 1 !== count( (array) $rows ) || $index_name !== (string) ( $rows[0]['COLUMN_NAME'] ?? '' ) || 1 !== (int) ( $rows[0]['NON_UNIQUE'] ?? -1 ) || 'BTREE' !== strtoupper( (string) ( $rows[0]['INDEX_TYPE'] ?? '' ) ) || null !== ( $rows[0]['SUB_PART'] ?? null ) ) {\n\t\t\t\tthrow new RuntimeException( 'Current session cleanup index could not be verified: ' . $index_name . '.' );\n\t\t\t}\n\t\t}\n\n\t\treturn true;\n"""
          if marker not in s: raise SystemExit('schema assertion tail marker missing')
          p.write_text(s.replace(marker,insertion))

          for q in Path('qa').glob('*'):
              if not q.is_file(): continue
              try: t=q.read_text()
              except UnicodeDecodeError: continue
              if '1.4.4' in t:
                  q.write_text(t.replace('1.4.4','1.4.5'))
          PY
      - name: Verify round 63 correction
        run: |
          set -euo pipefail
          php -l source/sabri-membership-core/sabri-membership-core.php
          php -l source/sabri-membership-core/includes/class-smc-installer.php
          php -l source/sabri-membership-core/includes/class-smc-schema-compat.php
          grep -q "SMC_DB_VERSION', '1.4.5" source/sabri-membership-core/sabri-membership-core.php
          grep -q "KEY expires_at (expires_at)" source/sabri-membership-core/includes/class-smc-installer.php
          grep -q "KEY revoked_at (revoked_at)" source/sabri-membership-core/includes/class-smc-installer.php
          grep -q "Current session cleanup index could not be verified" source/sabri-membership-core/includes/class-smc-schema-compat.php
          ! grep -R "1.4.4" qa >/dev/null
          git diff --check
      - name: Commit immediate round 63 correction
        run: |
          git config user.name 'File 00 QA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add source/sabri-membership-core/sabri-membership-core.php source/sabri-membership-core/includes/class-smc-installer.php source/sabri-membership-core/includes/class-smc-schema-compat.php qa
          git commit -m 'Round 63: index session cleanup paths and advance DB contract to 1.4.5'
          git push origin HEAD:audit/80-round-review-v1.2.40

name: File 00 Live Document Transport Recovery Gate

on:
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-document-transport-recovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none
      - name: PHP syntax
        run: |
          set -euo pipefail
          php -l source/sabri-membership-core/sabri-membership-core.php
          php -l source/sabri-membership-core/includes/class-smc-live-document-transport-repair.php
      - name: JavaScript syntax and regression contract
        run: |
          set -euo pipefail
          node --check source/sabri-membership-core/assets/membership-evidence-stage.js
          node qa/file00-live-document-transport-autosave-r1.mjs
      - name: Manifest diagnostics
        run: |
          set -euo pipefail
          cd source/sabri-membership-core
          sha256sum assets/membership-evidence-stage.js sabri-membership-core.php
      - name: Deterministic source manifest
        run: |
          set -euo pipefail
          (cd source/sabri-membership-core && sha256sum -c MANIFEST.sha256)

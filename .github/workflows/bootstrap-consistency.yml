name: File 00 Bootstrap Crash Consistency

on:
  pull_request:
    paths:
      - 'source/sabri-membership-core/sabri-membership-core.php'
      - 'qa/bootstrap-consistency-contract.mjs'
      - 'qa/bootstrap-consistency-wordpress-mysql.php'
      - '.github/workflows/bootstrap-consistency.yml'
  push:
    branches:
      - 'agent/file00-bootstrap-consistency-fix'
    paths:
      - 'source/sabri-membership-core/sabri-membership-core.php'
      - 'qa/bootstrap-consistency-contract.mjs'
      - 'qa/bootstrap-consistency-wordpress-mysql.php'
      - '.github/workflows/bootstrap-consistency.yml'

permissions:
  contents: read

jobs:
  bootstrap-consistency:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none
          extensions: mysqli, openssl, mbstring, json
          tools: none
      - name: Static crash-consistency contract
        run: |
          set -euo pipefail
          php -l source/sabri-membership-core/sabri-membership-core.php
          php -l qa/bootstrap-consistency-wordpress-mysql.php
          node qa/bootstrap-consistency-contract.mjs
          git diff --check
      - name: Install WordPress 7.0.1
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar -o /tmp/wp-cli.phar
          php /tmp/wp-cli.phar core download --version=7.0.1 --path=/tmp/wordpress --force
          php /tmp/wp-cli.phar config create --path=/tmp/wordpress --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          php /tmp/wp-cli.phar config set SMC_MASTER_KEY 'base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=' --type=constant --path=/tmp/wordpress
          php /tmp/wp-cli.phar config set SMC_MASTER_KEY_ID 'bootstrap-consistency-ci-v1' --type=constant --path=/tmp/wordpress
          php /tmp/wp-cli.phar config set WP_ENVIRONMENT_TYPE 'staging' --type=constant --path=/tmp/wordpress
          php /tmp/wp-cli.phar core install --path=/tmp/wordpress --url=http://bootstrap.local --title='File 00 Bootstrap CI' --admin_user=founder --admin_password='Bootstrap-CI-Password!9' --admin_email=founder@example.test --skip-email
      - name: Activate exact File 00 candidate
        run: |
          set -euo pipefail
          rm -rf /tmp/wordpress/wp-content/plugins/sabri-membership-core
          cp -R source/sabri-membership-core /tmp/wordpress/wp-content/plugins/sabri-membership-core
          php /tmp/wp-cli.phar plugin activate sabri-membership-core --path=/tmp/wordpress
      - name: Reproduce and close partial release-marker write
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/qa/bootstrap-consistency-wordpress-mysql.php" --path=/tmp/wordpress
          php /tmp/wp-cli.phar eval 'if (SMC_VERSION !== (string)get_option("smc_release_version", "")) { fwrite(STDERR, "release marker not current\n"); exit(31); } echo "PASS exact release marker current\n";' --path=/tmp/wordpress

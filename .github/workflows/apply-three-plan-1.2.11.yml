name: Apply File 00 Three-Plan 1.2.11

on:
  push:
    branches: ['codex/file00-forty-review-cycles-1.2.10']
    paths:
      - 'tools/apply-three-plan-contract-1.2.11.py'
      - '.github/workflows/apply-three-plan-1.2.11.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/file00-forty-review-cycles-1.2.10
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none
          tools: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Apply exact correction
        run: python3 tools/apply-three-plan-contract-1.2.11.py
      - name: Lint corrected runtime
        run: find source/sabri-membership-core qa -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Commit corrected source
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No correction delta.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'File 00 1.2.11: complete three-plan source contracts'
          git push origin HEAD:codex/file00-forty-review-cycles-1.2.10

          final_run = 30853003774
          contract_run = 30853003787
          artifact_id = 8871339869
          package_sha = '544395db2bb4d798dd9bcc44c14ae61b56d844568086859ecb11679413905adc'

          registry_path = Path('qa/requirements-traceability.json')
          data = json.loads(registry_path.read_text(encoding='utf-8'))
          data['document_version'] = '2.8-forty-round-verified'
          data['runtime_evidence'] = {
              'head_sha': head,
              'workflow_run_id': final_run,
              'contract_workflow_run_id': contract_run,
              'artifact_id': artifact_id,
              'conclusion': 'success',
              'merge_sha': '',
              'package': 'dist/00-sabri-membership-core-1.2.8.zip',
              'package_sha256': package_sha,
          }
          data['staging_installation_candidate'] = True
          review = data.setdefault('forty_round_review', {})
          review.update({
              'rounds': 40,
              'status': 'verified',
              'ledger': 'docs/FORTY-ROUND-REVIEW-1.2.8.md',
              'contract': 'qa/forty-round-contract.mjs',
              'exact_head_sha': head,
              'workflow_run_ids': [final_run, contract_run],
              'package_sha256': package_sha,
              'merge_sha': '',
          })
          for group in data.get('groups', []):
              group['evidence'] = [p.replace('1.2.7', '1.2.8') for p in group.get('evidence', [])]
          registry_path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          trace = Path('docs/FILE-00-IMPLEMENTATION-TRACEABILITY-1.2.8.md')
          text = trace.read_text(encoding='utf-8')
          text = text.replace(
              '> Forty-round source candidate. Exact-head CI, package checksum and merge evidence are pending and must not be inferred from 1.2.7.',
              '> Forty consecutive review-and-correction cycles and their repository-correctable source are exact-head verified. Final merge evidence remains pending until PR acceptance.'
          )
          text = text.replace(
              '- Verified head `Pending exact-head CI`; GitHub Actions: **Pending exact-head CI**',
              f'- Verified source head `{head}`; GitHub Actions: `{final_run}` and `{contract_run}` — **success**'
          )
          text = text.replace('- Main merge `Pending`', '- Main merge `Pending final PR acceptance`')
          text = text.replace('- Package SHA-256 `Pending`', f'- Package SHA-256 `{package_sha}`')
          trace.write_text(text, encoding='utf-8')


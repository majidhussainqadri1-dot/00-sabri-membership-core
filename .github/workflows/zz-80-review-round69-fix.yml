name: File 00 80-Review Round 69 Immediate Fix

on:
  push:
    branches: [audit/80-round-review-v1.2.40]
    paths: [.github/workflows/zz-80-review-round69-fix.yml]

permissions:
  contents: write

jobs:
  apply-round-69:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: audit/80-round-review-v1.2.40
          fetch-depth: 0
      - name: Make backup and restore evidence reflect actual persisted state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('source/sabri-membership-core/includes/class-smc-completion.php')
          s=p.read_text()
          old="""\t\treturn array(\n\t\t\t'manifest_version' => '1.0.0', 'generated_at' => gmdate( 'c' ), 'plugin_version' => SMC_VERSION,\n\t\t\t'database_version' => SMC_DB_VERSION, 'contract_version' => SMC_CONTRACT_VERSION,\n"""
          new="""\t\treturn array(\n\t\t\t'manifest_version' => '1.0.0', 'generated_at' => gmdate( 'c' ), 'plugin_version' => SMC_VERSION,\n\t\t\t'database_version' => (string) get_option( 'smc_db_version', '' ), 'target_database_version' => SMC_DB_VERSION,\n\t\t\t'release_version' => (string) get_option( 'smc_release_version', '' ), 'contract_version' => SMC_CONTRACT_VERSION,\n"""
          if old not in s: raise SystemExit('backup manifest version block missing')
          s=s.replace(old,new)

          old2="""\t\t$result = $ok ? 'passed' : 'failed';\n\t\tif ( ! SMC_Security::audit( 'post_restore_reconciliation_' . $result, 0, array( 'evidence_reference'=>$reference,'restore_run_id'=>is_array($proof)?sanitize_text_field($proof['restore_run_id']??''):'' ) ) ) { wp_die( esc_html__( 'Restore reconciliation evidence could not be appended to the audit chain.', 'sabri-membership-core' ), '', array( 'response'=>503 ) ); }\n\t\t$record = array( 'evidence_reference'=>$reference,'restore_run_id'=>is_array($proof)?sanitize_text_field($proof['restore_run_id']??''):'','checked_at'=>current_time('mysql',true),'result'=>$result,'health'=>$health );\n\t\tupdate_option( 'smc_last_restore_test', $record, false );\n\t\tif ( get_option( 'smc_last_restore_test', null ) !== $record ) { wp_die( esc_html__( 'Restore reconciliation finished, but its evidence record could not be persisted.', 'sabri-membership-core' ), '', array( 'response'=>503 ) ); }\n\t\tif ( ! $ok ) { wp_die( esc_html__( 'Restore proof did not satisfy the isolated-restore acceptance contract.', 'sabri-membership-core' ), '', array( 'response'=>409 ) ); }\n"""
          new2="""\t\t$result = $ok ? 'passed' : 'failed';\n\t\t$restore_run_id = is_array( $proof ) ? sanitize_text_field( $proof['restore_run_id'] ?? '' ) : '';\n\t\t$record = array( 'evidence_reference'=>$reference,'restore_run_id'=>$restore_run_id,'checked_at'=>current_time('mysql',true),'result'=>$result,'health'=>$health );\n\t\t$had_previous = false !== get_option( 'smc_last_restore_test', false );\n\t\t$previous = $had_previous ? get_option( 'smc_last_restore_test', array() ) : null;\n\t\tupdate_option( 'smc_last_restore_test', $record, false );\n\t\tif ( get_option( 'smc_last_restore_test', null ) !== $record ) {\n\t\t\tSMC_Security::audit( 'post_restore_reconciliation_persistence_failed', 0, array( 'restore_run_id'=>$restore_run_id ) );\n\t\t\twp_die( esc_html__( 'Restore reconciliation finished, but its evidence record could not be persisted.', 'sabri-membership-core' ), '', array( 'response'=>503 ) );\n\t\t}\n\t\t$audit_ok = SMC_Security::audit( 'post_restore_reconciliation_' . $result, 0, array( 'evidence_reference_digest'=>hash( 'sha256', $reference ),'restore_run_id'=>$restore_run_id ) );\n\t\tif ( ! $audit_ok ) {\n\t\t\tif ( $had_previous ) { update_option( 'smc_last_restore_test', $previous, false ); } else { delete_option( 'smc_last_restore_test' ); }\n\t\t\twp_die( esc_html__( 'Restore reconciliation evidence could not be appended to the audit chain; the status record was rolled back.', 'sabri-membership-core' ), '', array( 'response'=>503 ) );\n\t\t}\n\t\tif ( ! $ok ) { wp_die( esc_html__( 'Restore proof did not satisfy the isolated-restore acceptance contract.', 'sabri-membership-core' ), '', array( 'response'=>409 ) ); }\n"""
          if old2 not in s: raise SystemExit('restore reconciliation block missing')
          p.write_text(s.replace(old2,new2))
          PY
      - name: Verify round 69 correction
        run: |
          set -euo pipefail
          php -l source/sabri-membership-core/includes/class-smc-completion.php
          grep -q "target_database_version' => SMC_DB_VERSION" source/sabri-membership-core/includes/class-smc-completion.php
          grep -q "database_version' => (string) get_option( 'smc_db_version'" source/sabri-membership-core/includes/class-smc-completion.php
          grep -q "post_restore_reconciliation_persistence_failed" source/sabri-membership-core/includes/class-smc-completion.php
          grep -q "evidence_reference_digest" source/sabri-membership-core/includes/class-smc-completion.php
          grep -q "status record was rolled back" source/sabri-membership-core/includes/class-smc-completion.php
          git diff --check
      - name: Commit immediate round 69 correction
        run: |
          git config user.name 'File 00 QA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add source/sabri-membership-core/includes/class-smc-completion.php
          git commit -m 'Round 69: make backup restore evidence truthful and audit-coupled'
          git push origin HEAD:audit/80-round-review-v1.2.40

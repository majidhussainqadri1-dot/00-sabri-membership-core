name: Apply File 00 Fourth Fresh Ten-Review Corrections

on:
  push:
    branches: ['codex/file00-fourth-fresh-ten-review-1.2.17']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/file00-fourth-fresh-ten-review-1.2.17
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none
          tools: none
      - name: Apply corrections
        run: |
          python3 tools/apply-fourth-fresh-ten-review.py
          python3 tools/fix-fourth-static.py
      - name: Verify corrected source
        run: |
          npm ci --ignore-scripts
          npm run verify
          git diff --check
      - name: Remove temporary mutator and commit corrected source
        run: |
          set -euo pipefail
          git rm tools/apply-fourth-fresh-ten-review.py tools/fix-fourth-static.py .github/workflows/apply-fourth-fresh-ten-review.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'File 00 1.2.17 fourth fresh ten-round corrective closure'
          git push origin HEAD:codex/file00-fourth-fresh-ten-review-1.2.17

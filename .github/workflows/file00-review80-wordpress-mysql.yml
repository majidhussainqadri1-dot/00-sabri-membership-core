name: File 00 v1.2.44 Exact-Head Release Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  FILE02_REF: a714c23fea33ecdfe9110f69c0ee1f07c9f2bcbb
  FILE02_VERSION: '1.3.3'

jobs:
  review80-release:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact immutable File 00 head
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none
          extensions: mysqli, openssl, mbstring, json
          tools: none
      - name: Install Node QA dependencies
        run: npm ci --ignore-scripts
      - name: Static exact-head release gate
        run: |
          set -euo pipefail
          find source/sabri-membership-core -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l qa/review80-wordpress-mysql.php
          php -l qa/file02-account-contract-runtime-v1243.php
          php -l qa/file02-exact-consumer-compat.php
          npm test
          git diff --check
          test -z "$(find .github/workflows qa -maxdepth 1 -type f -name 'zz-*' -print -quit)"
      - name: Install pinned WP-CLI and WordPress 7.0.1
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar -o /tmp/wp-cli.phar
          php /tmp/wp-cli.phar core download --version=7.0.1 --path=/tmp/wordpress --force
          php /tmp/wp-cli.phar config create --path=/tmp/wordpress --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          php /tmp/wp-cli.phar config set SMC_MASTER_KEY 'base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=' --type=constant --path=/tmp/wordpress
          php /tmp/wp-cli.phar config set SMC_MASTER_KEY_ID 'review80-ci-key-v1' --type=constant --path=/tmp/wordpress
          php /tmp/wp-cli.phar config set SA_MASTER_KEY 'file02-integration-dedicated-master-key-2026' --type=constant --path=/tmp/wordpress
          php /tmp/wp-cli.phar config set WP_ENVIRONMENT_TYPE 'staging' --type=constant --path=/tmp/wordpress
          php /tmp/wp-cli.phar core install --path=/tmp/wordpress --url=http://review80.local --title='File 00 Review80 CI' --admin_user=founder --admin_password='Review80-CI-Password!9' --admin_email=founder@example.test --skip-email
      - name: Activate exact File 00 candidate and migrate
        run: |
          set -euo pipefail
          rm -rf /tmp/wordpress/wp-content/plugins/sabri-membership-core
          cp -R source/sabri-membership-core /tmp/wordpress/wp-content/plugins/sabri-membership-core
          php /tmp/wp-cli.phar plugin activate sabri-membership-core --path=/tmp/wordpress
          php /tmp/wp-cli.phar eval '
            $key=SMC_Security::ensure_key_ready(); if(is_wp_error($key)){fwrite(STDERR,$key->get_error_message()."\n");exit(40);}
            $audit=SMC_Installer::ensure_audit_infrastructure(); if(is_wp_error($audit)){fwrite(STDERR,$audit->get_error_message()."\n");exit(41);}
            SMC_Schema_Compat::reconcile_verification_queue_index(); SMC_Installer::maybe_upgrade();
            if(SMC_DB_VERSION!==(string)get_option("smc_db_version","")){fwrite(STDERR,"migration incomplete\n");exit(42);}
            if(SMC_VERSION!==(string)get_option("smc_release_version","")){fwrite(STDERR,"release marker incomplete\n");exit(43);}
            if(!defined("SMC_AUTHENTICATION_CONTRACT_V11_VERSION") || version_compare(SMC_AUTHENTICATION_CONTRACT_V11_VERSION,"1.1.0","<")){fwrite(STDERR,"File02 provider version unavailable\n");exit(44);}
            foreach(array("register_account","mark_email_verified","get_completion_state") as $m){if(!is_callable(array("SMC_Authentication_Contract_V11",$m))){fwrite(STDERR,"File02 provider method unavailable: $m\n");exit(45);}}
            SMC_Schema_Compat::assert_current_queue_indexes();
            echo "PASS canonical migration ".SMC_VERSION." / ".SMC_DB_VERSION." / auth-contract ".SMC_AUTHENTICATION_CONTRACT_V11_VERSION."\n";
          ' --path=/tmp/wordpress
      - name: Real WordPress MariaDB regressions
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/qa/review80-wordpress-mysql.php" --path=/tmp/wordpress
      - name: Checkout exact merged File 02 1.3.3
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: majidhussainqadri1-dot/02-sabri-authentication
          ref: ${{ env.FILE02_REF }}
          path: file02-exact
          fetch-depth: 1
          persist-credentials: false
      - name: Prove corrected File 02 activation boundary with corrected File 00
        run: |
          set -euo pipefail
          test "$(git -C file02-exact rev-parse HEAD)" = "$FILE02_REF"
          grep -Fq "Version: ${FILE02_VERSION}" file02-exact/sabri-authentication.php
          grep -Fq "require_once SAUTH_DIR . 'includes/class-sauth-storage-router.php';" file02-exact/sabri-authentication.php
          rm -rf /tmp/wordpress/wp-content/plugins/02-sabri-authentication
          cp -R file02-exact /tmp/wordpress/wp-content/plugins/02-sabri-authentication
          rm -rf /tmp/wordpress/wp-content/plugins/02-sabri-authentication/.git
          php /tmp/wp-cli.phar plugin activate 02-sabri-authentication --path=/tmp/wordpress
          php /tmp/wp-cli.phar eval '
            if(!is_plugin_active("02-sabri-authentication/sabri-authentication.php")){fwrite(STDERR,"File02 did not remain active\n");exit(50);}
            if(!class_exists("SAUTH_Storage_Router")){fwrite(STDERR,"File02 storage router unavailable after bootstrap\n");exit(51);}
            if(!class_exists("SAUTH_Account_Contract") || !SAUTH_Account_Contract::provider_available()){fwrite(STDERR,"File02 still rejects File00 account provider\n");exit(52);}
            if("1.3.3"!==(string)SAUTH_VERSION){fwrite(STDERR,"unexpected File02 version\n");exit(53);}
            echo "PASS File02 1.3.3 clean second request against File00 ".SMC_VERSION."\n";
          ' --path=/tmp/wordpress
          php /tmp/wp-cli.phar option get siteurl --path=/tmp/wordpress >/dev/null
          php /tmp/wp-cli.phar plugin status 02-sabri-authentication --path=/tmp/wordpress | grep -Fq 'Status: Active'
      - name: Prove signed-link verification becomes File 00 receipt-bearing truth
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval '
            global $wpdb;
            $email="file02-handoff@example.test";
            $user_id=wp_create_user("file02-handoff","Integration-Receipt-Password-2026!",$email);
            if(is_wp_error($user_id)){fwrite(STDERR,$user_id->get_error_message()."\n");exit(60);}
            $GLOBALS["file02_verification_message"]="";
            add_filter("sauth_email_verification_delivery",static function($delivered,$target,$subject,$message,$headers,$subject_id){
                $GLOBALS["file02_verification_message"]=(string)$message;
                return true;
            },10,6);
            $issued=SAUTH_Email_Verification::issue($user_id,$email,true);
            if(is_wp_error($issued)||"sent"!==(string)($issued["result"]??"")){fwrite(STDERR,"File02 issue failed\n");exit(61);}
            if(!preg_match("/[?&]token=([^&\\s]+)/",$GLOBALS["file02_verification_message"],$match)){fwrite(STDERR,"verification token not captured\n");exit(62);}
            $token=rawurldecode((string)$match[1]);
            $verified=SAUTH_Email_Verification::verify($user_id,$token);
            $token="";
            if(is_wp_error($verified)||"verified"!==(string)($verified["result"]??"")){fwrite(STDERR,"File02 verify failed: ".(is_wp_error($verified)?$verified->get_error_code():wp_json_encode($verified))."\n");exit(63);}
            $row=$wpdb->get_row($wpdb->prepare("SELECT verified_at,delivery_receipt_hash,delivered_at FROM {$wpdb->prefix}smc_contact_otps WHERE user_id=%d AND channel=%s LIMIT 1",$user_id,"email"),ARRAY_A);
            if(!is_array($row)||empty($row["verified_at"])||empty($row["delivered_at"])||1!==preg_match("/^[0-9a-f]{64}$/",(string)($row["delivery_receipt_hash"]??""))){fwrite(STDERR,"receipt-bearing File00 row missing\n");exit(64);}
            if(!SMC_Contracts::contact_verified($user_id,"email")){fwrite(STDERR,"File00 canonical reader rejected File02 verified-link receipt\n");exit(65);}
            $completion=SMC_Authentication_Contract_V11::get_completion_state($user_id,array("purpose"=>"post_authentication_completion"));
            if(!is_array($completion)||in_array("email",(array)($completion["missing_steps"]??array()),true)||false!==strpos((string)($completion["next_route"]??""),"/verify-email/")){fwrite(STDERR,"completion still routes verified email back to verification\n");exit(66);}
            $bad_email="file02-unscoped@example.test";
            $bad_user=wp_create_user("file02-unscoped","Integration-Unscoped-Password-2026!",$bad_email);
            if(is_wp_error($bad_user)){fwrite(STDERR,$bad_user->get_error_message()."\n");exit(67);}
            $bad=SMC_Authentication_Contract_V11::mark_email_verified($bad_user,$bad_email,array());
            if("deny"!==(string)($bad["result"]??"")||"email_verification_context_invalid"!==(string)($bad["reason_code"]??"")){fwrite(STDERR,"unscoped verification handoff did not fail closed\n");exit(68);}
            if(SMC_Contracts::contact_verified($bad_user,"email")){fwrite(STDERR,"unscoped handoff unexpectedly created canonical verification\n");exit(69);}
            echo "PASS File02 signed-link -> File00 receipt-bearing canonical email truth\n";
          ' --path=/tmp/wordpress
      - name: Cross-contract exact consumer shape
        env:
          FILE02_ROOT: ${{ github.workspace }}/file02-exact
        run: php qa/file02-exact-consumer-compat.php
      - name: Build and verify deterministic package
        run: |
          set -euo pipefail
          python3 tools/build.py
          python3 qa/verify-package.py dist/00-sabri-membership-core-1.2.44.zip
          sha256sum dist/00-sabri-membership-core-1.2.44.zip > dist/00-sabri-membership-core-1.2.44.zip.sha256
          unzip -t dist/00-sabri-membership-core-1.2.44.zip
      - name: Upload installable File 00 v1.2.44
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: File-00-Sabri-Membership-Core-1.2.44-File02-Compatibility-Reviewed
          path: |
            dist/00-sabri-membership-core-1.2.44.zip
            dist/00-sabri-membership-core-1.2.44.zip.sha256
          if-no-files-found: error
          retention-days: 30

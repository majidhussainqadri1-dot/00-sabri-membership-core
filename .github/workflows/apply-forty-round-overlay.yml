name: Apply File 00 Forty-Round Overlay

on:
  push:
    branches:
      - codex/file00-forty-review-cycles-1.2.8
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-overlay:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout target branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: codex/file00-forty-review-cycles-1.2.8
          fetch-depth: 0
          persist-credentials: true

      - name: Reassemble and verify overlay archive
        run: |
          set -euo pipefail
          cat \
            .forty-round-overlay/chunk0part0 \
            .forty-round-overlay/chunk0tail0 \
            .forty-round-overlay/chunk0tail1 \
            .forty-round-overlay/chunk0tail2 \
            .forty-round-overlay/chunk0tail3 \
            .forty-round-overlay/chunk0tail4 \
            .forty-round-overlay/chunk0tail5 \
            .forty-round-overlay/chunk1 \
            .forty-round-overlay/chunk2 \
            .forty-round-overlay/chunk3 \
            .forty-round-overlay/chunk4 > /tmp/file00-overlay.b64
          base64 --decode /tmp/file00-overlay.b64 > /tmp/file00-overlay.tar.gz
          echo '0783c72740a0c37b8875a4658cf43df9a4313e6c757a7276845555ae05d6bb2e  /tmp/file00-overlay.tar.gz' | sha256sum --check
          tar -tzf /tmp/file00-overlay.tar.gz >/tmp/file00-overlay.entries
          test -s /tmp/file00-overlay.entries
          tar -xzf /tmp/file00-overlay.tar.gz -C .

      - name: Apply reviewed source corrections
        run: |
          set -euo pipefail
          git apply --check overlay/source-1.2.8.patch
          git apply overlay/source-1.2.8.patch
          python3 tools/prepare_forty_round_overlay.py

      - name: Verify overlay before commit
        run: |
          set -euo pipefail
          git diff --check
          find source qa -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          node qa/forty-round-contract.mjs
          test "$(grep -Ec '^## Review Round [0-9]{2}$' docs/FORTY-ROUND-REVIEW-1.2.8.md)" -eq 40
          grep -Fq 'Version: 1.2.8' source/sabri-membership-core/sabri-membership-core.php
          grep -Fq "define( 'SMC_VERSION', '1.2.8' )" source/sabri-membership-core/sabri-membership-core.php

      - name: Remove one-time transport and commit
        run: |
          set -euo pipefail
          rm -rf .forty-round-overlay overlay/source-1.2.8.patch
          rmdir overlay 2>/dev/null || true
          rm -f tools/prepare_forty_round_overlay.py
          rm -f .github/workflows/apply-forty-round-overlay.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'File 00 1.2.8: apply forty review-and-correction cycles'
          git push origin HEAD:codex/file00-forty-review-cycles-1.2.8

name: File00 V12.3 File08 Exact Source Provider Consumer

on:
  pull_request:
  push:
    branches:
      - audit/file00-v123-actor-binding-20261114
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-source:
    name: File00 provider + File08 consumer PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    env:
      FILE00_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      FILE08_SHA: 1a358ead5ed02938fe2ee0bcb45494d53b4ffa8d
    steps:
      - name: Checkout exact File00 candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.FILE00_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout pinned File08 consumer candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: majidhussainqadri1-dot/08-worldwide-clinic-and-appointments-foundation
          ref: ${{ env.FILE08_SHA }}
          path: .external/file08
          fetch-depth: 0
          persist-credentials: false
      - name: Establish immutable source identities
        run: |
          test "$(git rev-parse HEAD)" = "$FILE00_SHA"
          test "$(git -C .external/file08 rev-parse HEAD)" = "$FILE08_SHA"
      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Verify File00 canonical lookup and File08 negative consumer boundaries
        run: |
          set -euo pipefail
          php -l source/sabri-membership-core/includes/class-smc-cf01-contract.php
          php -l source/sabri-membership-core/includes/functions.php
          php qa/v123-file08-inverse-subject-runtime.php
          (cd source/sabri-membership-core && sha256sum -c MANIFEST.sha256)
          (cd .external/file08 && php tests/t38-file00-subject-consumer-regressions.php)
          (cd .external/file08 && php tests/t38-file00-subject-unavailable-regression.php)

# This only proves pinned source-level boundaries, not installed multisite
# WordPress authorization, Staging DB migration or Live deployed behavior.

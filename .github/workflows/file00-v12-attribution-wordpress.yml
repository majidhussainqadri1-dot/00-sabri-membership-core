name: File00 V12 Real WordPress File04 Attribution Role Gate

on:
  push:
    branches:
      - codex/file00-v12-actor-binding-audit-20261103
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  file04-identity-role:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout exact File00 Draft candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checked-out immutable HEAD
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Checkout immutable File04 current-main consumer source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: majidhussainqadri1-dot/04-sabri-news-feed-and-publishing
          ref: bae1c70a168a09d7df09d634bd15050837e0b80a
          path: _pinned_file04
          persist-credentials: false
      - name: Checkout immutable File08 PR29 consumer candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: majidhussainqadri1-dot/08-worldwide-clinic-and-appointments-foundation
          ref: 1a358ead5ed02938fe2ee0bcb45494d53b4ffa8d
          path: _pinned_file08
          persist-credentials: false
      - name: Verify immutable companion source commits
        run: |
          set -euo pipefail
          test "$(git -C _pinned_file04 rev-parse HEAD)" = "bae1c70a168a09d7df09d634bd15050837e0b80a"
          test "$(git -C _pinned_file08 rev-parse HEAD)" = "1a358ead5ed02938fe2ee0bcb45494d53b4ffa8d"
      - name: Prepare PHP 8.3 and lint
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none
          extensions: mysqli, openssl, mbstring, json
          tools: none
      - name: Lint and source manifest
        run: |
          set -euo pipefail
          php -l qa/v12-file04-wordpress-attribution-role.php
          php -l qa/v12-real-wordpress-file04-file08-consumers.php
          php -l source/sabri-membership-core/includes/class-smc-cf01-contract.php
          (cd source/sabri-membership-core && sha256sum --check MANIFEST.sha256)
      - name: Install pinned WP-CLI and WordPress fixture
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar -o /tmp/wp-cli.phar
          php /tmp/wp-cli.phar core download --version=7.0.1 --path=/tmp/wordpress --force
          php /tmp/wp-cli.phar config create --path=/tmp/wordpress --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          php /tmp/wp-cli.phar config set SMC_MASTER_KEY 'base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=' --type=constant --path=/tmp/wordpress
          php /tmp/wp-cli.phar config set SMC_MASTER_KEY_ID 'file04-attribution-ci-key-v1' --type=constant --path=/tmp/wordpress
          php /tmp/wp-cli.phar config set WP_ENVIRONMENT_TYPE 'staging' --type=constant --path=/tmp/wordpress
          php /tmp/wp-cli.phar core install --path=/tmp/wordpress --url=http://file04-attribution-ci.local --title='File00 File04 Attribution CI' --admin_user=founder --admin_password='CI-Ephemeral-Only-Password!9' --admin_email=founder@example.test --skip-email
      - name: Activate exact File00 source and reconcile DB
        run: |
          set -euo pipefail
          cp -R source/sabri-membership-core /tmp/wordpress/wp-content/plugins/sabri-membership-core
          php /tmp/wp-cli.phar plugin activate sabri-membership-core --path=/tmp/wordpress
          php /tmp/wp-cli.phar eval 'SMC_Schema_Compat::reconcile_verification_queue_index(); SMC_Installer::maybe_upgrade(); if (SMC_DB_VERSION!==(string)get_option("smc_db_version","")) { fwrite(STDERR,"File00 schema not current\n"); exit(42); } if (is_wp_error(SMC_Security::ensure_key_ready())) { exit(43); } $a=SMC_Installer::ensure_audit_infrastructure(); if (is_wp_error($a)) { exit(44); } echo "PASS File00 source database ".SMC_DB_VERSION."\n";' --path=/tmp/wordpress
      - name: Exercise real WordPress File04 zero-role and legacy retirement
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/qa/v12-file04-wordpress-attribution-role.php" --path=/tmp/wordpress
      - name: Run real pinned File04 File08 consumer classes against WordPress and MariaDB
        run: |
          set -euo pipefail
          export FILE04_SOURCE_ROOT="$GITHUB_WORKSPACE/_pinned_file04"
          export FILE08_SOURCE_ROOT="$GITHUB_WORKSPACE/_pinned_file08"
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/qa/v12-real-wordpress-file04-file08-consumers.php" --path=/tmp/wordpress

name: File 00 80-Review Round 45 Immediate Fix

on:
  push:
    branches: [audit/80-round-review-v1.2.40]
    paths: [.github/workflows/zz-80-review-round45-fix.yml]

permissions:
  contents: write

jobs:
  apply-round-45:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: audit/80-round-review-v1.2.40
          fetch-depth: 0
      - name: Add privacy-minimal age and clinical-commerce projections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('source/sabri-membership-core/includes/class-smc-contracts.php')
          s=p.read_text()
          s=s.replace('private static function communication_age_context( $user_id )', 'private static function age_context( $user_id )')
          s=s.replace("\t\t\t'age_years'         => null,\n", "\t\t\t'age_band'          => 'unknown',\n")
          s=s.replace("\t\t\t\t$out['age_years'] = (int) $age;\n\t\t\t\t$out['minor'] = (int) $age < 18;\n", "\t\t\t\t$out['age_band'] = (int) $age < 18 ? 'minor' : 'adult';\n\t\t\t\t$out['minor'] = (int) $age < 18;\n")
          s=s.replace('$age = self::communication_age_context( $user_id );', '$age = self::age_context( $user_id );')

          marker="\tpublic static function communication_assertions( $user_id ) {\n"
          method="""\tpublic static function clinical_commerce_assertions( $user_id, $base = null ) {\n\t\t$base = is_array( $base ) ? $base : self::assertions( $user_id );\n\t\t$age = self::age_context( $user_id );\n\t\t$minor = ! empty( $age['minor'] );\n\t\t$guardian_ok = ! $minor || ! empty( $base['guardian_verified'] );\n\t\t$eligible = ! empty( $base['eligible'] ) && empty( $base['suspended'] ) && $guardian_ok;\n\t\treturn array(\n\t\t\t'contract_version' => $base['contract_version'],\n\t\t\t'user_id' => absint( $user_id ),\n\t\t\t'eligible' => $eligible,\n\t\t\t'suspended' => ! empty( $base['suspended'] ),\n\t\t\t'identity_current' => ! empty( $base['identity_documents_current'] ),\n\t\t\t'guardian_verified' => $guardian_ok,\n\t\t\t'age_context' => $age,\n\t\t\t'appointment_allowed' => $eligible,\n\t\t\t'appointment_requires_guardian_context' => $minor,\n\t\t\t'clinical_contact_requires_context' => $minor,\n\t\t\t'emergency_online_case_allowed' => false,\n\t\t\t'doctor_practice_allowed' => ! empty( $base['can_practice'] ),\n\t\t\t'marketplace_browse_allowed' => true,\n\t\t\t'marketplace_direct_deal_allowed' => $eligible && ! $minor,\n\t\t\t'marketplace_seller_actions_allowed' => $eligible && ! $minor,\n\t\t\t'platform_commission_percent' => 0,\n\t\t\t'consumer_authorization_recheck_required' => true,\n\t\t);\n\t}\n\n"""
          if method not in s:
              if marker not in s: raise SystemExit('communication marker missing')
              s=s.replace(marker,method+marker)

          needle="\t\t$base['transfer']     = self::transfer_assertions( $user_id, 0, array(), $base );\n"
          replacement=needle+"\t\t$base['age_context']  = self::age_context( $user_id );\n\t\t$base['clinical_commerce'] = self::clinical_commerce_assertions( $user_id, $base );\n"
          if "clinical_commerce']" not in s:
              if needle not in s: raise SystemExit('base nested-contract marker missing')
              s=s.replace(needle,replacement)
          p.write_text(s)

          q=Path('qa/three-plan-contract.mjs')
          if q.exists():
              t=q.read_text()
              add="""\nfor (const needle of ['clinical_commerce_assertions', 'appointment_requires_guardian_context', 'emergency_online_case_allowed', 'marketplace_direct_deal_allowed', 'platform_commission_percent']) { if (!contracts.includes(needle)) throw new Error(`missing clinical-commerce contract: ${needle}`); }\nif (contracts.includes("'age_years'")) throw new Error('privacy-minimal cross-file assertions must not expose exact age_years');\n"""
              if 'missing clinical-commerce contract' not in t: q.write_text(t+add)
          PY
      - name: Verify round 45 correction
        run: |
          set -euo pipefail
          php -l source/sabri-membership-core/includes/class-smc-contracts.php
          grep -q "clinical_commerce_assertions" source/sabri-membership-core/includes/class-smc-contracts.php
          grep -q "emergency_online_case_allowed' => false" source/sabri-membership-core/includes/class-smc-contracts.php
          grep -q "platform_commission_percent' => 0" source/sabri-membership-core/includes/class-smc-contracts.php
          ! grep -q "'age_years'" source/sabri-membership-core/includes/class-smc-contracts.php
          git diff --check
      - name: Commit immediate round 45 correction
        run: |
          git config user.name 'File 00 QA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add source/sabri-membership-core/includes/class-smc-contracts.php
          test ! -f qa/three-plan-contract.mjs || git add qa/three-plan-contract.mjs
          git commit -m 'Round 45: add privacy-minimal clinical and commerce restrictions'
          git push origin HEAD:audit/80-round-review-v1.2.40

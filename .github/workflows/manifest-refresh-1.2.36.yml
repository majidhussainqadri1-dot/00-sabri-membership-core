name: File 00 1.2.36 Manifest Refresh Evidence

on:
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Generate exact source manifest
        run: |
          set -euo pipefail
          python3 tools/build.py
          echo '---BEGIN-SOURCE-MANIFEST---'
          cat source/sabri-membership-core/MANIFEST.sha256
          echo '---END-SOURCE-MANIFEST---'

name: File 00 Version 1.2.7 Final Dual-Plan QA

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - codex/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build, test, verify package and 100-point traceability
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact immutable source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
          tools: none

      - name: Install locked QA dependencies
        run: npm ci --ignore-scripts

      - name: Build and verify deterministic package
        run: npm run verify

      - name: Verify final release identity and dual-plan evidence
        run: |
          set -euo pipefail
          grep -Fq 'Version: 1.2.7' source/sabri-membership-core/sabri-membership-core.php
          grep -Fq "define( 'SMC_VERSION', '1.2.7' )" source/sabri-membership-core/sabri-membership-core.php
          grep -Fq "define( 'SMC_DB_VERSION', '1.2.0' )" source/sabri-membership-core/sabri-membership-core.php
          grep -Fq "define( 'SMC_CONTRACT_VERSION', '1.1.2' )" source/sabri-membership-core/sabri-membership-core.php
          grep -Fq 'private static function approval_gate' source/sabri-membership-core/includes/class-smc-admin.php
          grep -Fq 'BINARY evidence_snapshot=%s' source/sabri-membership-core/includes/class-smc-admin.php
          grep -Fq 'function smc_privacy_erasure_lock' source/sabri-membership-core/includes/functions.php
          grep -Fq 'private static function lock_for_erasure' source/sabri-membership-core/includes/class-smc-privacy.php
          test -f source/sabri-membership-core/includes/class-smc-cf01-contract.php
          test -f qa/completion-hardening-contract.mjs
          test -f qa/approval-gate-runtime.php
          test -f qa/privacy-erasure-runtime.php
          test -f qa/cf01-contract.mjs
          test -f qa/cf01-contract-runtime.php
          test -f qa/requirements-traceability.json
          test -f docs/FILE-00-MASTER-PLAN-2026.md
          test -f docs/FILE-00-IMPLEMENTATION-TRACEABILITY-1.2.7.md
          test -f docs/FINAL-PLAN-COMPLETION-1.2.7.md
          test -f .github/workflows/file00-final-dual-plan-qa.yml
          test -f dist/00-sabri-membership-core-1.2.7.zip
          test -f dist/CHECKSUMS.sha256
          grep -Fq 'Runtime implementation release: `1.2.7`' docs/FILE-00-MASTER-PLAN-2026.md
          grep -Fq 'Repository code completion: **100%**' docs/FILE-00-IMPLEMENTATION-TRACEABILITY-1.2.7.md
          test "$(grep -Ec '^\| F00-R[0-9]{3} \|' docs/FILE-00-IMPLEMENTATION-TRACEABILITY-1.2.7.md)" -eq 100

      - name: Upload verified WordPress package and traceability evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 00-sabri-membership-core-1.2.7-${{ github.sha }}
          path: |
            dist/00-sabri-membership-core-1.2.7.zip
            dist/CHECKSUMS.sha256
            docs/FILE-00-MASTER-PLAN-2026.md
            docs/FILE-00-IMPLEMENTATION-TRACEABILITY-1.2.7.md
            docs/FINAL-PLAN-COMPLETION-1.2.7.md
            qa/requirements-traceability.json
          if-no-files-found: error
          retention-days: 30

name: File 00 Version 1.2.9 Executable Dual-Plan QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build, test, verify 100 requirements and executable gap closure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact immutable source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none
          tools: none
      - name: Install locked QA dependencies
        run: npm ci --ignore-scripts
      - name: Build and verify deterministic package
        run: npm run verify
      - name: Verify final candidate identity and evidence
        run: |
          set -euo pipefail
          grep -Fq 'Version: 1.2.9' source/sabri-membership-core/sabri-membership-core.php
          grep -Fq "define( 'SMC_DB_VERSION', '1.3.0' )" source/sabri-membership-core/sabri-membership-core.php
          test -f qa/dual-plan-runtime-completion-contract.mjs
          test -f docs/DUAL-PLAN-CODE-COMPLETION-1.2.9.md
          test -f docs/FILE-00-IMPLEMENTATION-TRACEABILITY-1.2.9.md
          test -f dist/00-sabri-membership-core-1.2.9.zip
          test "$(grep -Ec '^\| F00-R[0-9]{3} \|' docs/FILE-00-IMPLEMENTATION-TRACEABILITY-1.2.9.md)" -eq 100
          node qa/dual-plan-runtime-completion-contract.mjs
      - name: Upload verified package and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 00-sabri-membership-core-1.2.9-${{ github.sha }}
          path: |
            dist/00-sabri-membership-core-1.2.9.zip
            dist/CHECKSUMS.sha256
            docs/FILE-00-MASTER-PLAN-2026.md
            docs/FILE-00-IMPLEMENTATION-TRACEABILITY-1.2.9.md
            docs/DUAL-PLAN-CODE-COMPLETION-1.2.9.md
            qa/requirements-traceability.json
          if-no-files-found: error
          retention-days: 30

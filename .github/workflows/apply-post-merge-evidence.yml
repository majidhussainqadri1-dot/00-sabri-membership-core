name: Apply File 00 Post-Merge Evidence

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - codex/file00-1.2.8-post-merge-evidence

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: codex/file00-1.2.8-post-merge-evidence
          fetch-depth: 0
          persist-credentials: true

      - name: Reconcile post-merge evidence
        run: python3 tools/reconcile_post_merge_evidence.py

      - name: Commit reconciled evidence
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md STATUS.md docs/FILE-00-MASTER-PLAN-2026.md docs/FILE-00-IMPLEMENTATION-TRACEABILITY-1.2.8.md docs/FINAL-PLAN-COMPLETION-1.2.8.md qa/requirements-traceability.json
          git diff --cached --check
          git commit -m 'File 00 1.2.8: reconcile post-merge evidence'
          git push origin HEAD:codex/file00-1.2.8-post-merge-evidence

name: File 00 80-Review Round 53 Immediate Fix

on:
  push:
    branches: [audit/80-round-review-v1.2.40]
    paths: [.github/workflows/zz-80-review-round53-fix.yml]

permissions:
  contents: write

jobs:
  apply-round-53:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: audit/80-round-review-v1.2.40
          fetch-depth: 0
      - name: Remove impossible retired-MFA status blocker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('source/sabri-membership-core/includes/class-smc-workflow.php')
          s=p.read_text()
          s=s.replace("\t\telseif ( ! $a['two_factor_ready'] ) { $next_action = __( 'Enable two-factor authentication in Membership Security.', 'sabri-membership-core' ); }\n",'')
          s=s.replace("if ( ! empty( $a['institutional_account'] ) && 'verified' === $a['status'] && ( ! $a['email_verified'] || ! $a['phone_verified'] || ! $a['two_factor_ready'] ) ) {\n\t\t\t$application_label = __( 'Institutionally recognized — security/contact setup incomplete', 'sabri-membership-core' );\n", "if ( ! empty( $a['institutional_account'] ) && 'verified' === $a['status'] && ( ! $a['email_verified'] || ! $a['phone_verified'] ) ) {\n\t\t\t$application_label = __( 'Institutionally recognized — contact setup incomplete', 'sabri-membership-core' );\n")
          old="\t\t\t\t<div><dt><?php esc_html_e( 'Two-factor security', 'sabri-membership-core' ); ?></dt><dd><?php echo $a['two_factor_ready'] ? esc_html__( 'Enabled', 'sabri-membership-core' ) : esc_html__( 'Required', 'sabri-membership-core' ); ?></dd></div>\n"
          new="\t\t\t\t<div><dt><?php esc_html_e( 'Authentication owner', 'sabri-membership-core' ); ?></dt><dd><?php esc_html_e( 'Sabri Authentication (File 02); File 00 MFA retired', 'sabri-membership-core' ); ?></dd></div>\n"
          if old not in s: raise SystemExit('stale MFA status row not found')
          s=s.replace(old,new)
          p.write_text(s)

          q=Path('qa/mfa-retirement-contract.mjs')
          if q.exists():
              t=q.read_text()
              if 'Enable two-factor authentication in Membership Security.' not in t:
                  t += "\nlacks(workflow, 'Enable two-factor authentication in Membership Security.', 'status UI must not require retired File 00 MFA');\nlacks(workflow, \"'Two-factor security'\", 'status UI must not present retired MFA as required');\nhas(workflow, 'File 00 MFA retired', 'status UI names File 02 authentication ownership');\n"
                  q.write_text(t)
          PY
      - name: Verify round 53 correction
        run: |
          set -euo pipefail
          php -l source/sabri-membership-core/includes/class-smc-workflow.php
          ! grep -q 'Enable two-factor authentication in Membership Security.' source/sabri-membership-core/includes/class-smc-workflow.php
          ! grep -q "'Two-factor security'" source/sabri-membership-core/includes/class-smc-workflow.php
          grep -q 'File 00 MFA retired' source/sabri-membership-core/includes/class-smc-workflow.php
          node qa/mfa-retirement-contract.mjs
          git diff --check
      - name: Commit immediate round 53 correction
        run: |
          git config user.name 'File 00 QA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add source/sabri-membership-core/includes/class-smc-workflow.php qa/mfa-retirement-contract.mjs
          git commit -m 'Round 53: remove retired MFA from membership status UX'
          git push origin HEAD:audit/80-round-review-v1.2.40

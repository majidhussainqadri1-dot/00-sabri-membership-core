name: Review10 Round1 Audit Digest Repair

on:
  push:
    branches: ['audit/80-round-review-v1.2.40']

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: audit/80-round-review-v1.2.40
          fetch-depth: 0
      - name: Apply exact proven repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('source/sabri-membership-core/includes/class-smc-lifecycle.php')
          s = p.read_text()
          old = """\t\t$decoded = isset( $row['details'] ) && is_string( $row['details'] ) ? json_decode( $row['details'], true ) : null;\n\t\treturn array(\n\t\t\t'action' => isset( $row['action'] ) ? sanitize_key( $row['action'] ) : '',\n\t\t\t'reason' => is_array( $decoded ) ? sanitize_key( $decoded['reason_code'] ?? $decoded['reason'] ?? '' ) : '',\n\t\t);\n"""
          new = """\t\t$decoded = isset( $row['details'] ) && is_string( $row['details'] ) ? json_decode( $row['details'], true ) : null;\n\t\t$reason = is_array( $decoded ) ? sanitize_key( $decoded['reason_code'] ?? $decoded['reason'] ?? '' ) : '';\n\t\tif ( '' === $reason && is_array( $decoded ) ) {\n\t\t\t// Audit privacy intentionally digests keys containing `reason`/`code`.\n\t\t\t// Recognize only the one allowlisted automated lifecycle reason without\n\t\t\t// recovering or exposing arbitrary sensitive audit detail.\n\t\t\t$age_reason_digest = hash( 'sha256', self::AUTOMATED_AGE_REASON );\n\t\t\tforeach ( array( 'reason_code_digest', 'reason_digest' ) as $digest_key ) {\n\t\t\t\t$digest = strtolower( trim( (string) ( $decoded[ $digest_key ] ?? '' ) ) );\n\t\t\t\tif ( preg_match( '/^[a-f0-9]{64}$/', $digest ) && hash_equals( $age_reason_digest, $digest ) ) {\n\t\t\t\t\t$reason = self::AUTOMATED_AGE_REASON;\n\t\t\t\t\tbreak;\n\t\t\t\t}\n\t\t\t}\n\t\t}\n\t\treturn array(\n\t\t\t'action' => isset( $row['action'] ) ? sanitize_key( $row['action'] ) : '',\n\t\t\t'reason' => $reason,\n\t\t);\n"""
          if old not in s:
              raise SystemExit('expected lifecycle context block not found; refusing broad patch')
          p.write_text(s.replace(old, new, 1))
          PY
          php -l source/sabri-membership-core/includes/class-smc-lifecycle.php
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('source/sabri-membership-core')
          manifest = root / 'MANIFEST.sha256'
          paths=[]
          for p in root.rglob('*'):
              if p.is_file() and p.name != 'MANIFEST.sha256':
                  paths.append(p)
          lines=[]
          for p in sorted(paths, key=lambda x: x.relative_to(root).as_posix()):
              rel=p.relative_to(root).as_posix()
              lines.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {rel}")
          manifest.write_text('\n'.join(lines)+'\n')
          PY
          rm .github/workflows/zz-review10-round1-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/sabri-membership-core/includes/class-smc-lifecycle.php source/sabri-membership-core/MANIFEST.sha256 .github/workflows/zz-review10-round1-patch.yml
          git commit -m 'Round 1: honor privacy-digested automated age reason'
          git push origin HEAD:audit/80-round-review-v1.2.40

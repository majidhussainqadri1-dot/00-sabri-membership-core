name: Reconcile File 00 v1.2.32 QA

on:
  push:
    branches: ['fix/code-only-audit-32-2026-08-08']

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Assert v1.2.32 source is materialized
        run: |
          set -euo pipefail
          grep -q 'Version: 1.2.32' source/sabri-membership-core/sabri-membership-core.php
          grep -q "define( 'SMC_DB_VERSION', '1.4.3' )" source/sabri-membership-core/sabri-membership-core.php
          grep -q "define( 'SMC_CONTRACT_VERSION', '1.2.1' )" source/sabri-membership-core/sabri-membership-core.php
          cd source/sabri-membership-core && sha256sum -c MANIFEST.sha256

      - name: Reconcile active QA and repository metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
            'qa/membership-state-contract.mjs': [('1.2.20','1.2.32'), ('1.4.0','1.4.3')],
            'qa/institutional-lifecycle-contract.mjs': [('1.2.19','1.2.32'), ('1.4.0','1.4.3')],
            'qa/authorization-boundary-contract.mjs': [
              ('1.2.19','1.2.32'), ('1.4.0','1.4.3'),
              ("main.includes('SMC_Authorization::init()')", "main.includes(\"array( 'SMC_Authorization', 'init' )\")")
            ],
            'qa/completion-hardening-contract.mjs': [('1.2.19','1.2.32'), ('1.4.0','1.4.3')],
            'qa/cf01-contract.mjs': [
              ('1.2.19','1.2.32'), ('1.4.0','1.4.3'),
              ("main.includes('SMC_CF01_Contract::init()')", "main.includes(\"array( 'SMC_CF01_Contract', 'init' )\")")
            ],
            'qa/audit32-wordpress-mysql.php': [('1.2.20','1.2.32'), ('1.4.0','1.4.3')],
            '.github/workflows/audit32-wordpress-mysql.yml': [('1.2.20','1.2.32'), ('1.4.0','1.4.3')],
            '.github/workflows/file00-hostinger-all-actions-livefix.yml': [('1.2.20','1.2.32')],
            'qa/run-tests.mjs': [("'smc_send_contact_otp',", "'SMC_Contact_Delivery',")],
            'STATUS.md': [('1.2.19','1.2.32'), ('1.4.0','1.4.3')],
          }
          for name, reps in replacements.items():
              p = Path(name)
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              for old, new in reps:
                  s = s.replace(old, new)
              p.write_text(s, encoding='utf-8')

          Path('RELEASE-1.2.32.md').write_text('''# File 00 — Sabri Membership Core 1.2.32\n\n## Runtime identity\n- Runtime: `1.2.32`\n- Database schema: `1.4.3`\n- Public contract: `1.2.1`\n\n## Corrective scope\nIncludes the original 32-finding code-only audit corrections and Hostinger live-test hardening through v1.2.32: deferred activation bootstrap, Hostinger-safe user actions/document submission, File 19 email/SMS provider boundaries, nonce/origin handling, TOTP enrollment diagnostics, audit schema bootstrap/reconciliation, missing-tail recovery, and trusted historical audit-key verification.\n\n## Acceptance boundary\nSource and automated QA status are distinct from live production acceptance. The v1.2.32 trusted historical audit-key transition still requires final live-site confirmation against existing audit record 16. Real email/SMS providers, full browser/mobile/accessibility acceptance, isolated backup restore/rollback, independent security review, and Founder acceptance remain separate gates.\n''', encoding='utf-8')
          PY

      - name: Full static runtime and package QA
        run: |
          set -euo pipefail
          find source/sabri-membership-core -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check source/sabri-membership-core/assets/membership.js
          git diff --check
          npm ci
          npm test
          python3 tools/build.py
          python3 qa/verify-package.py dist/00-sabri-membership-core-1.2.32.zip

      - name: Commit reconciled QA and remove one-shot workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/reconcile-v132-qa.yml
          git config user.name file00-qa-reconciler
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m '[qa-reconcile] Align File 00 v1.2.32 QA and release metadata'
          git push origin HEAD:fix/code-only-audit-32-2026-08-08

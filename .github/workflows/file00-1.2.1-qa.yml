name: File 00 Version 1.2.1 QA

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build, test, and verify package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out proposed source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked QA dependencies
        run: npm ci --ignore-scripts

      - name: Build and verify deterministic package
        run: npm run verify

      - name: Verify declared versions
        run: |
          grep -Fq 'Version: 1.2.1' source/sabri-membership-core/sabri-membership-core.php
          grep -Fq "define( 'SMC_VERSION', '1.2.1' )" source/sabri-membership-core/sabri-membership-core.php
          grep -Fq "define( 'SMC_CONTRACT_VERSION', '1.1.0' )" source/sabri-membership-core/sabri-membership-core.php
          test -f dist/00-sabri-membership-core-1.2.1.zip
          test -f dist/CHECKSUMS.sha256

      - name: Upload verified WordPress package
        uses: actions/upload-artifact@v4
        with:
          name: 00-sabri-membership-core-1.2.1
          path: |
            dist/00-sabri-membership-core-1.2.1.zip
            dist/CHECKSUMS.sha256
          if-no-files-found: error
          retention-days: 30

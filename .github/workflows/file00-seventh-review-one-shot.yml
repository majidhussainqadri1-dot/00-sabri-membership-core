name: File 00 Seventh Fresh Ten-Round Corrective Applicator

on:
  push:
    branches:
      - codex/file00-seventh-fresh-ten-review-1.2.20
    paths:
      - .github/workflows/file00-seventh-review-one-shot.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/file00-seventh-fresh-ten-review-1.2.20
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: none
      - name: Install locked test dependency
        run: npm ci --ignore-scripts
      - name: Configure review identity
        run: |
          git config user.name "File 00 Review Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Apply seventh fresh review from repository root
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, pathlib, re, zlib
          wrapper = pathlib.Path('tools/file00_seventh_review_bootstrap.py').read_text(encoding='utf-8')
          match = re.search(r"b64decode\('([^']+)'\)", wrapper)
          if not match:
              raise SystemExit('embedded review payload not found')
          code = zlib.decompress(base64.b64decode(match.group(1))).decode('utf-8')
          old = 'Path(__file__).resolve().parents[1]'
          if old not in code:
              raise SystemExit('review payload root marker not found')
          code = code.replace(old, 'Path.cwd()', 1)
          marker = "run('node',STAGE_QA);run('node',static);run('npm','test')"
          if marker not in code:
              raise SystemExit('full-suite marker not found')
          release_sync = """# Round 10 current-runtime fixture synchronization. Historical changelog/trace identities are retained.\nfor qp in (ROOT/'qa').rglob('*'):\n    if not qp.is_file() or qp.suffix not in ('.mjs','.php'):\n        continue\n    qx=qp.read_text(encoding='utf-8')\n    qn=qx\n    for before,after in [\n        ('Version: 1.2.19','Version: 1.2.20'),\n        (\"SMC_VERSION', '1.2.19\",\"SMC_VERSION', '1.2.20\"),\n        ('Stable tag: 1.2.19','Stable tag: 1.2.20'),\n        (\"define('SMC_VERSION', '1.2.19')\",\"define('SMC_VERSION', '1.2.20')\"),\n        (\"define('SMC_VERSION','1.2.19')\",\"define('SMC_VERSION','1.2.20')\"),\n        (\"pkg.version==='1.2.19'\",\"pkg.version==='1.2.20'\"),\n        ('Runtime implementation release: `1.2.19`','Runtime implementation release: `1.2.20`'),\n    ]:\n        qn=qn.replace(before,after)\n    if qn!=qx:\n        qp.write_text(qn,encoding='utf-8')\n"""
          code = code.replace(marker, release_sync + marker, 1)
          target = pathlib.Path('/tmp/file00_seventh_review_apply.py')
          target.write_text(code, encoding='utf-8')
          scope = {'__name__': '__main__', '__file__': str(target)}
          exec(compile(code, str(target), 'exec'), scope)
          PY

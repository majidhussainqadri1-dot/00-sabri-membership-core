name: File00 V12 Pinned File04 + File08 Consumer Runtime
on:
  push:
    branches:
      - codex/file00-v12-actor-binding-audit-20261103
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-cross-repository-contract:
    name: Pinned File04/File08 real-source PHP ${{ matrix.php }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - name: Exact File00 candidate checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Immutable File04 current-source checkout
        uses: actions/checkout@v4
        with:
          repository: majidhussainqadri1-dot/04-sabri-news-feed-and-publishing
          ref: bae1c70a168a09d7df09d634bd15050837e0b80a
          path: _pinned_file04
          persist-credentials: false
      - name: Immutable File08 consumer PR29 checkout
        uses: actions/checkout@v4
        with:
          repository: majidhussainqadri1-dot/08-worldwide-clinic-and-appointments-foundation
          ref: 1a358ead5ed02938fe2ee0bcb45494d53b4ffa8d
          path: _pinned_file08
          persist-credentials: false
      - name: Verify exact immutable companion source IDs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _pinned_file04 rev-parse HEAD)" = "bae1c70a168a09d7df09d634bd15050837e0b80a"
          test "$(git -C _pinned_file08 rev-parse HEAD)" = "1a358ead5ed02938fe2ee0bcb45494d53b4ffa8d"
          printf 'File04 and File08: exact pinned commit provenance verified\n'
      - name: Prepare PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none
      - name: Run real-source consumer/provider negative runtime fixtures
        env:
          FILE04_SOURCE_ROOT: ${{ github.workspace }}/_pinned_file04
          FILE08_SOURCE_ROOT: ${{ github.workspace }}/_pinned_file08
        shell: bash
        run: |
          set -euo pipefail
          php -l qa/v12-pinned-real-companion-runtime.php
          php qa/v12-pinned-real-companion-runtime.php

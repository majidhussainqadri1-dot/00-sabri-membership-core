name: Apply File 00 forty-round multi-role assertion correction

on:
  push:
    branches: [codex/file00-dual-plan-completion-1.2.9]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'codex/file00-dual-plan-completion-1.2.9' || github.ref == 'refs/heads/codex/file00-dual-plan-completion-1.2.9'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/file00-dual-plan-completion-1.2.9
          fetch-depth: 0
      - name: Apply exact reviewed assertion correction
        run: |
          set -euo pipefail
          if [ -f .github/file00-forty-role-assertion.applied ]; then exit 0; fi
          git apply --check .github/file00-forty-role-assertion.patch
          git apply .github/file00-forty-role-assertion.patch
          rm -f .github/file00-forty-role-assertion.patch
          printf '%s\n' applied > .github/file00-forty-role-assertion.applied
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "File 00 1.2.9: align forty-round regression with multi-role grants"
          git push origin HEAD:codex/file00-dual-plan-completion-1.2.9

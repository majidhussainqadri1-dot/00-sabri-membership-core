name: File 00 R10 Release Identity Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Print current plugin digests and release references
        run: |
          set -euo pipefail
          sha256sum source/sabri-membership-core/includes/class-smc-authorization.php
          sha256sum source/sabri-membership-core/sabri-membership-core.php
          sha256sum source/sabri-membership-core/README.txt
          echo '--- current 1.2.40 references ---'
          grep -RIn --exclude-dir=.git '1\.2\.40' . || true

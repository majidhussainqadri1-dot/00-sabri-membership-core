name: Apply File 00 Advanced Trust 1.2.13

on:
  push:
    branches: ['codex/file00-advanced-trust-1.2.13']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/codex/file00-advanced-trust-1.2.13'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/file00-advanced-trust-1.2.13
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none
          tools: none
      - name: Apply deterministic release patch
        run: |
          set -euo pipefail
          python3 tools/apply-advanced-trust-1.2.13.py
          php -l source/sabri-membership-core/includes/class-smc-advanced-trust-2026.php
          php -l source/sabri-membership-core/includes/class-smc-contracts.php
          php -l source/sabri-membership-core/sabri-membership-core.php
      - name: Commit only non-workflow release changes
        run: |
          set -euo pipefail
          git checkout -- .github/workflows/file00-three-plan-qa.yml .github/workflows/cf01-contract.yml
          git diff --check
          git add source/sabri-membership-core/includes/class-smc-contracts.php package.json package-lock.json tools/build.py qa docs/FILE-00-MASTER-PLAN-2026.md
          if git diff --cached --quiet; then
            echo 'Non-workflow release patch already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete File 00 advanced trust release wiring for 1.2.13'
          git push origin HEAD:codex/file00-advanced-trust-1.2.13

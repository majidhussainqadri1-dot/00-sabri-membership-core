name: Apply File 00 1.2.9 static-contract correction

on:
  push:
    branches: [codex/file00-dual-plan-completion-1.2.9]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'codex/file00-dual-plan-completion-1.2.9' || github.ref == 'refs/heads/codex/file00-dual-plan-completion-1.2.9'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/file00-dual-plan-completion-1.2.9
          fetch-depth: 0
      - name: Apply exact reviewed correction
        run: |
          set -euo pipefail
          if [ -f .github/file00-1.2.9-static-contract-fix.applied ]; then exit 0; fi
          test "$(sha256sum .github/file00-1.2.9-static-contract-fix.patch | awk '{print $1}')" = "6637ddb447831eb034c72e2b6e9e4094ef68377d33ed41b6affe1c87c8e0d992"
          git apply --check .github/file00-1.2.9-static-contract-fix.patch
          git apply .github/file00-1.2.9-static-contract-fix.patch
          rm -f .github/file00-1.2.9-static-contract-fix.patch
          printf '%s\n' applied > .github/file00-1.2.9-static-contract-fix.applied
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "File 00 1.2.9: align inherited controls with jurisdiction and multi-role runtime"
          git push origin HEAD:codex/file00-dual-plan-completion-1.2.9

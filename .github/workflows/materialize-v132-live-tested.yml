name: Materialize File 00 v1.2.32 Live-Tested Source

on:
  push:
    branches: ['fix/code-only-audit-32-2026-08-08']

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout corrective branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Verify exact v1.2.20 livefix baseline
        run: |
          set -euo pipefail
          test "$(git hash-object source/sabri-membership-core/sabri-membership-core.php)" = "f53449be698280c09e593cdb10de158aa217da3b"
          test "$(git hash-object source/sabri-membership-core/includes/class-smc-security.php)" = "9068710f23d40d6e034c9b818164e99f90471c81"
          test "$(git hash-object source/sabri-membership-core/assets/membership.js)" = "8695c3fbdf5819ae7ea58da084f82b8ab45c1af7"
          test "$(git hash-object source/sabri-membership-core/MANIFEST.sha256)" = "515b1fb9c3e6c47ca8c2303cb7d01bacfacace16"

      - name: Reconstruct exact v1.2.32 patch
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            983dd07aa0c4ca7c8335bd4e12da25dbf9927a48b0f0b5899d2e3c7d087ced48 tools/livefix/v132-patch.part00 \
            92573fb70b6f1bcc4f5c295b4baf1f45d1ea29617334be81d3bcdf894a8e87d5 tools/livefix/v132-patch.part01 \
            2b53df80b9acc362c410bfa9c0ccfd38e136cd1e43ede8b7292bcd7787b730c9 tools/livefix/v132-patch.part02 \
            34ddb095d0fed57ba307ae1a7b2d2baef517c788fdb4aa23346e83a5475ceaf3 tools/livefix/v132-patch.part03a \
            91b284dd5523055154bf703d82c0c9465f4f001520febbcba3f03457a3cd132c tools/livefix/v132-patch.part03b0 \
            e15505a0760532612d83b2b03248e70e1214d46c38084c2dbca6803d95e6df42 tools/livefix/v132-patch.part03b1a \
            9233d9b3e60fb506c750b1e4a153adc0a8be857a5b0471388a2ea46e06a63db7 tools/livefix/v132-patch.part03b1b \
            3c5ca7d9494b03abb240abb65e80a5f0570afbb6828a55d57c81599546433820 tools/livefix/v132-patch.part04 | sha256sum -c -
          cat tools/livefix/v132-patch.part00 tools/livefix/v132-patch.part01 tools/livefix/v132-patch.part02 tools/livefix/v132-patch.part03a tools/livefix/v132-patch.part03b0 tools/livefix/v132-patch.part03b1a tools/livefix/v132-patch.part03b1b tools/livefix/v132-patch.part04 > /tmp/v132.patch.gz.b64
          test "$(sha256sum /tmp/v132.patch.gz.b64 | awk '{print $1}')" = 3102dd219fbf0966093b2f39d33da1ac93f4330401342f4592815d042429754f
          base64 --decode /tmp/v132.patch.gz.b64 | gzip -dc > /tmp/file00-v132.patch
          test "$(sha256sum /tmp/file00-v132.patch | awk '{print $1}')" = b7d9c3a7577a65e9039b4fc31a1b252927511cbb30a2a45922f6d26e0c115f84

      - name: Apply exact live-tested source and verify manifest
        run: |
          set -euo pipefail
          cd source/sabri-membership-core
          patch --batch --forward -p2 < /tmp/file00-v132.patch
          grep -q 'Version: 1.2.32' sabri-membership-core.php
          grep -q "define( 'SMC_DB_VERSION', '1.4.3' )" sabri-membership-core.php
          grep -q "define( 'SMC_CONTRACT_VERSION', '1.2.1' )" sabri-membership-core.php
          sha256sum -c MANIFEST.sha256

      - name: Align repository metadata and QA contracts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ('package.json','package-lock.json'):
              p=Path(name); d=json.loads(p.read_text())
              d['version']='1.2.32'
              if name=='package-lock.json': d.setdefault('packages',{}).setdefault('',{})['version']='1.2.32'
              if name=='package.json': d['scripts']['verify']='npm run build && npm test && python3 qa/verify-package.py dist/00-sabri-membership-core-1.2.32.zip'
              p.write_text(json.dumps(d,indent=2)+'\n')
          replacements={
            'qa/membership-state-contract.mjs':[('1.2.20','1.2.32'),('1.4.0','1.4.3')],
            'qa/institutional-lifecycle-contract.mjs':[('1.2.19','1.2.32'),('1.4.0','1.4.3')],
            'qa/authorization-boundary-contract.mjs':[('1.2.19','1.2.32'),('1.4.0','1.4.3'),("main.includes('SMC_Authorization::init()')","main.includes(\"array( 'SMC_Authorization', 'init' )\")")],
            'qa/completion-hardening-contract.mjs':[('1.2.19','1.2.32'),('1.4.0','1.4.3')],
            'qa/cf01-contract.mjs':[('1.2.19','1.2.32'),('1.4.0','1.4.3'),("main.includes('SMC_CF01_Contract::init()')","main.includes(\"array( 'SMC_CF01_Contract', 'init' )\")")],
            'qa/ilhami-cycle-contract.mjs':[
              ('1.2.19','1.2.32'),('1.4.0','1.4.3'),
              ("workflow.indexOf(\"INSERT INTO {$wpdb->prefix}smc_contact_otps\") < workflow.indexOf(\"apply_filters( 'smc_send_contact_otp'\")","workflow.indexOf(\"INSERT INTO {$wpdb->prefix}smc_contact_otps\") < workflow.indexOf('SMC_Contact_Delivery::send_otp')"),
              ("workflow.includes(\"status='delivery_failed',is_current=0\") && workflow.includes('SET is_current=1 WHERE id=%d')","workflow.includes(\"status='delivery_failed',is_current=0\") && workflow.includes(\"SET is_current=1,withdrawn_at=IF(status='superseded',NULL,withdrawn_at)\")"),
              ("security.indexOf(\"self::audit( 'recovery_codes_rotated'\", recoveryStart) < security.indexOf(\"$wpdb->query( 'COMMIT' );\", recoveryStart)","security.indexOf(\"self::audit( 'recovery_codes_rotated'\", recoveryStart) < security.indexOf(\"false === $wpdb->query( 'COMMIT' )\", recoveryStart)")
            ],
            'qa/audit32-wordpress-mysql.php':[('1.2.20','1.2.32'),('1.4.0','1.4.3')],
            '.github/workflows/audit32-wordpress-mysql.yml':[('1.2.20','1.2.32'),('1.4.0','1.4.3')],
            '.github/workflows/file00-hostinger-all-actions-livefix.yml':[('1.2.20','1.2.32')],
            'README.md':[('1.2.19','1.2.32'),('1.4.0','1.4.3')],
            'STATUS.md':[('1.2.19','1.2.32'),('1.4.0','1.4.3')],
            'qa/run-tests.mjs':[("'smc_send_contact_otp',","'SMC_Contact_Delivery',")],
          }
          for name,reps in replacements.items():
              p=Path(name)
              if not p.exists(): continue
              s=p.read_text()
              for a,b in reps: s=s.replace(a,b)
              p.write_text(s)
          Path('RELEASE-1.2.32.md').write_text('''# File 00 — Sabri Membership Core 1.2.32\n\nRuntime `1.2.32`; database schema `1.4.3`; public contract `1.2.1`.\n\nThis corrective candidate incorporates the original audit corrections plus Hostinger live-test hardening through v1.2.32: activation bootstrap, user actions/document submission, File 19 email/SMS provider boundaries, nonce/origin handling, TOTP diagnostics, audit schema bootstrap/reconciliation, verified missing-tail recovery, and trusted historical audit-key verification.\n\nThe record-16 historical-key hypothesis still requires final live-site confirmation. Provider acceptance, full browser/mobile/accessibility acceptance, isolated restore/rollback, independent security review and Founder acceptance remain separate gates.\n''')
          PY

      - name: Static, full QA and deterministic package gate
        run: |
          set -euo pipefail
          find source/sabri-membership-core -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check source/sabri-membership-core/assets/membership.js
          git diff --check
          npm ci
          npm test
          python3 tools/build.py
          python3 qa/verify-package.py dist/00-sabri-membership-core-1.2.32.zip

      - name: Remove one-shot transport
        run: |
          set -euo pipefail
          git rm -f tools/livefix/v120-to-v132.patch.gz.b64 || true
          git rm -f tools/livefix/v132-patch.part00 tools/livefix/v132-patch.part01 tools/livefix/v132-patch.part02 tools/livefix/v132-patch.part03 tools/livefix/v132-patch.part03a tools/livefix/v132-patch.part03b tools/livefix/v132-patch.part03b0 tools/livefix/v132-patch.part03b1a tools/livefix/v132-patch.part03b1b tools/livefix/v132-patch.part04
          git rm -f .github/workflows/materialize-v132-live-tested.yml

      - name: Commit materialized v1.2.32 source
        run: |
          set -euo pipefail
          git config user.name file00-live-materializer
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m '[live-materialize] File 00 v1.2.32 tested source and CI identity'
          git push origin HEAD:fix/code-only-audit-32-2026-08-08

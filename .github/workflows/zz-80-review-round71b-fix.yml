name: File 00 80-Review Round 71 Release Identity Retry

on:
  push:
    branches: [audit/80-round-review-v1.2.40]
    paths: [.github/workflows/zz-80-review-round71b-fix.yml]

permissions:
  contents: write

jobs:
  apply-round-71:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: audit/80-round-review-v1.2.40
          fetch-depth: 0
      - name: Advance release identity without touching workflow files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('.')
          p=root/'source/sabri-membership-core/sabri-membership-core.php'; s=p.read_text()
          if ' * Version: 1.2.39' not in s or "define( 'SMC_VERSION', '1.2.39' );" not in s or "define( 'SMC_CONTRACT_VERSION', '1.2.2' );" not in s:
              raise SystemExit('expected pre-1.2.40 runtime identity not found')
          s=s.replace(' * Version: 1.2.39',' * Version: 1.2.40')
          s=s.replace("define( 'SMC_VERSION', '1.2.39' );", "define( 'SMC_VERSION', '1.2.40' );")
          s=s.replace("define( 'SMC_CONTRACT_VERSION', '1.2.2' );", "define( 'SMC_CONTRACT_VERSION', '1.2.3' );")
          p.write_text(s)

          for name in ['package.json','package-lock.json']:
              p=root/name
              if p.exists():
                  t=p.read_text().replace('"version": "1.2.39"','"version": "1.2.40"').replace('00-sabri-membership-core-1.2.39.zip','00-sabri-membership-core-1.2.40.zip')
                  p.write_text(t)

          # Current executable QA follows candidate identity; historical JSON evidence is untouched.
          for q in (root/'qa').iterdir():
              if not q.is_file() or q.suffix.lower() == '.json': continue
              try: t=q.read_text()
              except UnicodeDecodeError: continue
              t=t.replace('1.2.39','1.2.40').replace('1.2.2','1.2.3').replace('1.4.4','1.4.5')
              q.write_text(t)

          p=root/'docs/FILE-00-MASTER-PLAN-2026.md'
          if p.exists():
              t=p.read_text().replace('Runtime implementation release: `1.2.39`','Runtime implementation release: `1.2.40`').replace('Public membership contract: `1.2.2`','Public membership contract: `1.2.3`').replace('Database schema target: `1.4.4`','Database schema target: `1.4.5`')
              p.write_text(t)

          p=root/'source/sabri-membership-core/README.txt'; t=p.read_text()
          t=t.replace('Stable tag: 1.2.39','Stable tag: 1.2.40',1)
          if '= 1.2.40 =' not in t:
              marker='= 1.2.39 =\n'
              note=("= 1.2.40 =\n"
                    "* 80-round exact-head corrective candidate: removes residual retired File 00 MFA dependencies, strengthens role replacement, minor/clinical-commerce privacy contracts, durable event/repair recovery, session cleanup indexes, and backup/restore truth.\n"
                    "* Runtime 1.2.40; DB schema 1.4.5; public membership contract 1.2.3; CF-01 1.1.0; Advanced Trust 1.0.0. Repository/CI completion does not itself claim live deployment.\n\n")
              if marker not in t: raise SystemExit('README changelog insertion point missing')
              t=t.replace(marker,note+marker,1)
          p.write_text(t)
          PY
      - name: Verify round 71 identity correction
        run: |
          set -euo pipefail
          php -l source/sabri-membership-core/sabri-membership-core.php
          grep -q 'Version: 1.2.40' source/sabri-membership-core/sabri-membership-core.php
          grep -q "SMC_VERSION', '1.2.40" source/sabri-membership-core/sabri-membership-core.php
          grep -q "SMC_DB_VERSION', '1.4.5" source/sabri-membership-core/sabri-membership-core.php
          grep -q "SMC_CONTRACT_VERSION', '1.2.3" source/sabri-membership-core/sabri-membership-core.php
          grep -q 'Stable tag: 1.2.40' source/sabri-membership-core/README.txt
          grep -q '"version": "1.2.40"' package.json
          ! grep -R --include='*.mjs' --include='*.php' --include='*.js' "1.2.39" qa >/dev/null
          ! grep -R --include='*.mjs' --include='*.php' --include='*.js' "1.2.2" qa >/dev/null
          git diff --check
      - name: Commit round 71 identity correction
        run: |
          set -euo pipefail
          git config user.name 'File 00 QA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add source/sabri-membership-core/sabri-membership-core.php source/sabri-membership-core/README.txt package.json package-lock.json qa docs/FILE-00-MASTER-PLAN-2026.md
          git commit -m 'Round 71: advance File 00 runtime 1.2.40 and public contract 1.2.3'
          git push origin HEAD:audit/80-round-review-v1.2.40

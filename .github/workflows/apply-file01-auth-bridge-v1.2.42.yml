name: Materialize exact File 00 v1.2.42 candidate

on:
  push:
    branches:
      - fix/file01-auth-bridge-v1.2.42

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Align permanent exact-head workflows with v1.2.42
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('.github/workflows').glob('*.yml'):
              if p.name == 'apply-file01-auth-bridge-v1.2.42.yml':
                  continue
              s=p.read_text()
              if '1.2.41' in s:
                  p.write_text(s.replace('1.2.41','1.2.42'))
          PY
      - name: Install QA dependencies
        run: npm ci
      - name: Refresh deterministic source manifest
        run: python3 tools/build.py
      - name: Remove temporary write-capable workflow before exact-tree QA
        run: rm -f .github/workflows/apply-file01-auth-bridge-v1.2.42.yml
      - name: Run complete source/runtime QA
        run: npm test
      - name: Verify deterministic package and PHP syntax
        run: |
          python3 qa/verify-package.py dist/00-sabri-membership-core-1.2.42.zip
          php -l source/sabri-membership-core/includes/class-smc-authorization.php
          php -l source/sabri-membership-core/sabri-membership-core.php
      - name: Create exact tested final-tree commit and attempt publication
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: align File 00 v1.2.42 exact-head gates'
          echo "EXACT_CANDIDATE_SHA=$(git rev-parse HEAD)"
          git push origin HEAD:fix/file01-auth-bridge-v1.2.42

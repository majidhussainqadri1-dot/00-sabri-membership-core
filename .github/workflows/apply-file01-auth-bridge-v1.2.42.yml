name: Apply File 01 authorization bridge v1.2.42

on:
  push:
    branches:
      - fix/file01-auth-bridge-v1.2.42

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply root-cause fix
        run: python3 tools/apply-file01-auth-bridge-v1.2.42.py
      - name: Preserve immutable trace and correct focused runtime fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('qa/master-plan-traceability-contract.mjs')
          s=p.read_text()
          s=s.replace("master.includes('Supplemental ten-round corrective review — 1.2.42')", "master.includes('Supplemental ten-round corrective review — 1.2.41')")
          p.write_text(s)

          p=Path('qa/file01-foundation-auth-bridge-runtime.php')
          s=p.read_text()
          s=s.replace("$GLOBALS['current']=1;$c=SMC_Authorization::file01_authorization_claim", "$GLOBALS['founder']=1;$GLOBALS['current']=1;$c=SMC_Authorization::file01_authorization_claim", 1)
          s=s.replace("$GLOBALS['current']=4;$c=SMC_Authorization::file01_authorization_claim", "$GLOBALS['founder']=4;$GLOBALS['current']=4;$c=SMC_Authorization::file01_authorization_claim", 1)
          p.write_text(s)
          PY
      - name: Install QA dependencies
        run: npm ci
      - name: Refresh deterministic source manifest
        run: python3 tools/build.py
      - name: Remove temporary write-capable workflow before exact-tree QA
        run: rm -f .github/workflows/apply-file01-auth-bridge-v1.2.42.yml
      - name: Run permanent source/runtime QA
        run: npm test
      - name: Verify deterministic package and PHP syntax
        run: |
          python3 qa/verify-package.py dist/00-sabri-membership-core-1.2.42.zip
          php -l source/sabri-membership-core/includes/class-smc-authorization.php
          php -l source/sabri-membership-core/sabri-membership-core.php
      - name: Commit corrected candidate and remove apply helper
        run: |
          rm -f tools/apply-file01-auth-bridge-v1.2.42.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: add File 01 authorization claim bridge v1.2.42'
          git push origin HEAD:fix/file01-auth-bridge-v1.2.42

name: Review10 Round4 Institutional Repair Completion
on:
  push:
    branches: ['audit/80-round-review-v1.2.40']
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: audit/80-round-review-v1.2.40
          fetch-depth: 0
      - name: Apply exact completion fix
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('source/sabri-membership-core/includes/class-smc-lifecycle.php')
          s=p.read_text()
          old="""\tpublic static function institutional_repair_complete() {\n\t\treturn 0 === self::$repair_failures;\n\t}\n"""
          new="""\tpublic static function institutional_repair_complete() {\n\t\treturn 0 === self::$repair_failures\n\t\t\t&& 0 === absint( get_option( self::INSTITUTIONAL_REPAIR_CURSOR_OPTION, 0 ) );\n\t}\n"""
          if old not in s:
              raise SystemExit('expected completion block not found; refusing broad patch')
          p.write_text(s.replace(old,new,1))
          PY
          php -l source/sabri-membership-core/includes/class-smc-lifecycle.php
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('source/sabri-membership-core')
          paths=sorted((p for p in root.rglob('*') if p.is_file() and p.name!='MANIFEST.sha256'), key=lambda p:p.relative_to(root).as_posix())
          (root/'MANIFEST.sha256').write_text('\n'.join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root).as_posix()}" for p in paths)+'\n')
          PY
          rm .github/workflows/zz-review10-round4-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/sabri-membership-core/includes/class-smc-lifecycle.php source/sabri-membership-core/MANIFEST.sha256 .github/workflows/zz-review10-round4-patch.yml
          git commit -m 'Round 4: require institutional repair cursor exhaustion'
          git push origin HEAD:audit/80-round-review-v1.2.40

name: File 00 MFA Retirement + Live Migration WordPress MariaDB Gate

on:
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mfa-retirement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact immutable File 00 head
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none
          extensions: mysqli, openssl, mbstring, json
          tools: none

      - name: Install Node QA dependencies
        run: npm ci --ignore-scripts

      - name: Static syntax and contract gates
        run: |
          set -euo pipefail
          find source/sabri-membership-core -name '*.php' -print0 | xargs -0 -n1 php -l
          node qa/mfa-retirement-contract.mjs
          node qa/file02-account-contract-v1243.mjs
          php qa/file02-account-contract-runtime-v1243.php

      - name: Install pinned WP-CLI and WordPress 7.0.1
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar -o /tmp/wp-cli.phar
          php /tmp/wp-cli.phar --info
          php /tmp/wp-cli.phar core download --version=7.0.1 --path=/tmp/wordpress --force
          php /tmp/wp-cli.phar config create --path=/tmp/wordpress --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          php /tmp/wp-cli.phar config set SMC_MASTER_KEY 'base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=' --type=constant --path=/tmp/wordpress
          php /tmp/wp-cli.phar config set SMC_MASTER_KEY_ID 'mfa-retirement-ci-key-v1' --type=constant --path=/tmp/wordpress
          php /tmp/wp-cli.phar config set WP_ENVIRONMENT_TYPE 'staging' --type=constant --path=/tmp/wordpress
          php /tmp/wp-cli.phar core install --path=/tmp/wordpress --url=http://mfa-retirement.local --title='File 00 MFA Retirement CI' --admin_user=founder --admin_password='MFA-Retirement-CI-Password!9' --admin_email=founder@example.test --skip-email

      - name: Activate candidate and complete canonical migration
        run: |
          set -euo pipefail
          rm -rf /tmp/wordpress/wp-content/plugins/sabri-membership-core
          cp -R source/sabri-membership-core /tmp/wordpress/wp-content/plugins/sabri-membership-core
          php /tmp/wp-cli.phar plugin activate sabri-membership-core --path=/tmp/wordpress
          php /tmp/wp-cli.phar eval '
            $key = SMC_Security::ensure_key_ready();
            if ( is_wp_error( $key ) ) { fwrite(STDERR, $key->get_error_code().": ".$key->get_error_message()."\n"); exit(40); }
            $audit = SMC_Installer::ensure_audit_infrastructure();
            if ( is_wp_error( $audit ) ) { fwrite(STDERR, $audit->get_error_code().": ".$audit->get_error_message()."\n"); exit(41); }
            SMC_Installer::maybe_upgrade();
            if ( SMC_DB_VERSION !== get_option("smc_db_version","") ) {
              fwrite(STDERR, "schema migration incomplete: ".wp_json_encode(get_option("smc_last_migration_failure",array()))."\n");
              exit(42);
            }
            if ( ! defined("SMC_AUTHENTICATION_CONTRACT_V11_VERSION") || "1.1.0" !== SMC_AUTHENTICATION_CONTRACT_V11_VERSION ) { fwrite(STDERR,"File02 account provider unavailable\n"); exit(43); }
            SMC_Schema_Compat::assert_current_queue_indexes();
            echo "PASS canonical File 00 migration ready\n";
          ' --path=/tmp/wordpress

      - name: Reproduce exact live legacy indexes and Administrator role-backfill state
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval '
            global $wpdb;
            $admin = get_user_by("login", "founder");
            if ( ! $admin || ! user_can( $admin, "manage_options" ) ) { fwrite(STDERR,"Administrator fixture missing\n"); exit(56); }
            if ( ! smc_application( $admin->ID ) ) { SMC_Contracts::register_account( $admin->ID ); }
            $app = smc_application( $admin->ID );
            if ( ! $app ) { fwrite(STDERR,"Administrator application fixture missing\n"); exit(57); }
            if ( false === $wpdb->update( $wpdb->prefix."smc_applications", array("membership_type"=>"member","status"=>"draft","row_version"=>4,"updated_at"=>current_time("mysql",true)), array("user_id"=>(int)$admin->ID) ) ) { fwrite(STDERR,"Administrator application fixture update failed\n"); exit(58); }
            $roles = array_values( (array) get_userdata( $admin->ID )->roles ); sort($roles);
            update_option("smc_v1239_admin_roles_before", $roles, false);
            $state = smc_membership_state( $admin->ID );
            if ( empty($state["institutional_account"]) || empty($state["approved"]) || "verified" !== ($state["status"] ?? "") ) { fwrite(STDERR,"Administrator institutional precedence fixture failed\n"); exit(59); }
          ' --path=/tmp/wordpress
          php /tmp/wp-cli.phar db query "
            ALTER TABLE wp_smc_verification_requests DROP INDEX queue, ADD KEY queue(status,assigned_reviewer);
            ALTER TABLE wp_smc_approval_votes DROP INDEX decision, ADD KEY decision(request_id,decision);
            DROP TABLE IF EXISTS wp_smc_event_outbox;
            DROP TABLE IF EXISTS wp_smc_event_inbox;
            DROP TABLE IF EXISTS wp_smc_application_repairs;
            UPDATE wp_options SET option_value='1.2.0' WHERE option_name='smc_db_version';
            UPDATE wp_options SET option_value='1.2.5' WHERE option_name='smc_release_version';
            DELETE FROM wp_smc_migrations WHERE migration_key='role-grants-to-1.3.0';
            DELETE rg FROM wp_smc_role_grants rg INNER JOIN wp_users u ON u.ID=rg.user_id WHERE u.user_login='founder';
          " --path=/tmp/wordpress
          php /tmp/wp-cli.phar eval '
            global $wpdb;
            SMC_Schema_Compat::reconcile_verification_queue_index();
            SMC_Installer::maybe_upgrade();
            if ( SMC_DB_VERSION !== get_option("smc_db_version","") ) { fwrite(STDERR,"legacy named-index/Admin-role migration incomplete: ".wp_json_encode(get_option("smc_last_migration_failure",array()))."\n"); exit(51); }
            SMC_Schema_Compat::assert_current_queue_indexes();
            $admin = get_user_by("login", "founder");
            $checkpoint = $wpdb->get_row($wpdb->prepare("SELECT status,cursor_value FROM {$wpdb->prefix}smc_migrations WHERE migration_key=%s", "role-grants-to-1.3.0"), ARRAY_A);
            if ( ! $checkpoint || "complete" !== ($checkpoint["status"] ?? "") ) { fwrite(STDERR,"Administrator role-grant checkpoint did not complete\n"); exit(60); }
            $before = (array) get_option("smc_v1239_admin_roles_before", array()); sort($before);
            $after = array_values((array)get_userdata($admin->ID)->roles); sort($after);
            if ( $before !== $after || ! in_array("administrator", $after, true) ) { fwrite(STDERR,"Administrator native roles were mutated by File 00 backfill\n"); exit(61); }
            $grant = $wpdb->get_row($wpdb->prepare("SELECT membership_type,status FROM {$wpdb->prefix}smc_role_grants WHERE user_id=%d AND membership_type=%s", $admin->ID, "member"), ARRAY_A);
            if ( ! $grant || "pending" !== ($grant["status"] ?? "") ) { fwrite(STDERR,"Administrator canonical membership grant was not backfilled\n"); exit(62); }
            delete_option("smc_v1239_admin_roles_before");
            echo "PASS named-index and Administrator role-backfill regressions\n";
          ' --path=/tmp/wordpress

      - name: Reproduce exact live orphaned application state and recover safely
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval '
            global $wpdb;
            require_once ABSPATH . "wp-admin/includes/user.php";
            $a = wp_insert_user(array("user_login"=>"orphan_live_a","user_email"=>"orphan-a@example.test","user_pass"=>"Orphan-Fixture-Password!9","role"=>"subscriber"));
            $b = wp_insert_user(array("user_login"=>"orphan_live_b","user_email"=>"orphan-b@example.test","user_pass"=>"Orphan-Fixture-Password!9","role"=>"subscriber"));
            if ( is_wp_error($a) || is_wp_error($b) ) { fwrite(STDERR,"orphan user fixture creation failed\n"); exit(70); }
            SMC_Contracts::register_account($a);
            SMC_Contracts::register_account($b);
            $wpdb->update($wpdb->prefix."smc_applications",array("membership_type"=>"doctor","status"=>"suspended","row_version"=>9,"updated_at"=>current_time("mysql",true)),array("user_id"=>$a));
            $wpdb->update($wpdb->prefix."smc_applications",array("membership_type"=>"member","status"=>"suspended","row_version"=>8,"updated_at"=>current_time("mysql",true)),array("user_id"=>$b));
            $app_a = smc_application($a); $app_b = smc_application($b);
            if ( !$app_a || !$app_b ) { fwrite(STDERR,"orphan application fixture missing\n"); exit(71); }
            $wpdb->delete($wpdb->prefix."smc_role_grants",array("user_id"=>$a),array("%d"));
            $wpdb->delete($wpdb->prefix."smc_role_grants",array("user_id"=>$b),array("%d"));
            if ( ! SMC_Contracts::upsert_role_grant($a,"doctor","pending",9,0) ) { fwrite(STDERR,"interrupted derivative grant fixture failed\n"); exit(72); }
            update_option("smc_v1239_orphan_fixture",array("a"=>$a,"b"=>$b,"app_a"=>(int)$app_a["id"],"app_b"=>(int)$app_b["id"]),false);
            if ( ! wp_delete_user($a) || ! wp_delete_user($b) ) { fwrite(STDERR,"fixture WordPress user deletion failed\n"); exit(73); }
            if ( get_userdata($a) || get_userdata($b) ) { fwrite(STDERR,"deleted WordPress principals still resolve\n"); exit(74); }
            if ( ! smc_application($a) || ! smc_application($b) ) { fwrite(STDERR,"historical applications were not preserved by fixture\n"); exit(75); }
            $wpdb->query($wpdb->prepare("DELETE FROM {$wpdb->prefix}smc_application_repairs WHERE user_id IN (%d,%d)",$a,$b));
            $wpdb->query($wpdb->prepare("DELETE FROM {$wpdb->prefix}smc_migrations WHERE migration_key=%s","role-grants-to-1.3.0"));
            update_option("smc_db_version","1.2.0",false);
            update_option("smc_release_version","1.2.5",false);
            update_option("smc_last_migration_failure",array("scope"=>"upgrade","message"=>"Role-grant backfill failed.","time"=>current_time("mysql",true)),false);
            update_option("smc_migration_deferred_v1",array("reason"=>"key_configuration_required","target_release"=>"1.2.19","updated_at"=>current_time("mysql",true)),false);
            update_option("smc_activation_bootstrap_state_v2",array("status"=>"deferred_safe","phase"=>"deferred_upgrade","message"=>"stale fixture","updated_at"=>current_time("mysql",true)),false);
            echo "PASS exact missing-principal fixture established\n";
          ' --path=/tmp/wordpress
          php /tmp/wp-cli.phar eval '
            global $wpdb;
            $admin=get_user_by("login","founder"); wp_set_current_user($admin->ID);
            do_action("admin_init");
            $f=(array)get_option("smc_v1239_orphan_fixture",array());
            if ( SMC_DB_VERSION !== get_option("smc_db_version","") ) { fwrite(STDERR,"orphan-safe migration did not promote DB: ".wp_json_encode(get_option("smc_last_migration_failure",array()))."\n"); exit(76); }
            if ( SMC_VERSION !== get_option("smc_release_version","") ) { fwrite(STDERR,"orphan-safe migration did not promote release\n"); exit(77); }
            $checkpoint=$wpdb->get_row($wpdb->prepare("SELECT status,cursor_value FROM {$wpdb->prefix}smc_migrations WHERE migration_key=%s","role-grants-to-1.3.0"),ARRAY_A);
            if ( !$checkpoint || "complete" !== ($checkpoint["status"] ?? "") || (int)$checkpoint["cursor_value"] < max((int)$f["app_a"],(int)$f["app_b"]) ) { fwrite(STDERR,"orphan-safe checkpoint incomplete\n"); exit(78); }
            foreach ( array("a","b") as $key ) {
              $uid=(int)$f[$key]; $app=smc_application($uid);
              if ( !$app || get_userdata($uid) ) { fwrite(STDERR,"orphan source evidence/principal state changed\n"); exit(79); }
              $repair=$wpdb->get_row($wpdb->prepare("SELECT repair_type,status,details FROM {$wpdb->prefix}smc_application_repairs WHERE user_id=%d AND repair_type=%s ORDER BY id DESC LIMIT 1",$uid,"orphaned_application_missing_user"),ARRAY_A);
              if ( !$repair || "pending" !== ($repair["status"] ?? "") ) { fwrite(STDERR,"orphan repair quarantine missing\n"); exit(80); }
            }
            $grant_a=$wpdb->get_row($wpdb->prepare("SELECT status FROM {$wpdb->prefix}smc_role_grants WHERE user_id=%d LIMIT 1",(int)$f["a"]),ARRAY_A);
            if ( !$grant_a || "suspended" !== ($grant_a["status"] ?? "") ) { fwrite(STDERR,"interrupted orphan grant was not suspended\n"); exit(81); }
            $grant_b=(int)$wpdb->get_var($wpdb->prepare("SELECT COUNT(*) FROM {$wpdb->prefix}smc_role_grants WHERE user_id=%d",(int)$f["b"]));
            if ( 0 !== $grant_b ) { fwrite(STDERR,"compatibility bridge fabricated a grant for second missing principal\n"); exit(82); }
            $audit_count=(int)$wpdb->get_var("SELECT COUNT(*) FROM {$wpdb->prefix}smc_audit_log WHERE action=\"orphaned_membership_application_quarantined\"");
            if ( $audit_count < 2 ) { fwrite(STDERR,"orphan quarantine audit evidence missing\n"); exit(83); }
            if ( false !== get_option("smc_migration_deferred_v1",false) || false !== get_option("smc_last_migration_failure",false) ) { fwrite(STDERR,"exact stale migration markers were not cleared after promotion\n"); exit(84); }
            $state=(array)get_option("smc_activation_bootstrap_state_v2",array());
            if ( "ready" !== ($state["status"] ?? "") ) { fwrite(STDERR,"bootstrap did not become ready\n"); exit(85); }
            SMC_Schema_Compat::assert_current_queue_indexes();
            delete_option("smc_v1239_orphan_fixture");
            echo "PASS live-proven orphaned applications quarantined, checkpointed, audited and promoted without source deletion\n";
          ' --path=/tmp/wordpress

      - name: Prove MFA retirement in real WordPress and MariaDB
        run: |
          set -euo pipefail
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/qa/mfa-retirement-wordpress-mysql.php" --path=/tmp/wordpress

      - name: Build and verify installable File 00 package
        run: |
          set -euo pipefail
          python3 tools/build.py
          python3 qa/verify-package.py dist/00-sabri-membership-core-1.2.43.zip

      - name: Upload installable File 00 v1.2.43 ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: File-00-Sabri-Membership-Core-1.2.43-File02-Compatible
          path: dist/00-sabri-membership-core-1.2.43.zip
          if-no-files-found: error
          retention-days: 30
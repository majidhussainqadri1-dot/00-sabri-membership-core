name: File 00 Sixth Fresh Ten-Round Corrective Applicator
# Non-workflow reviewed changes are pushed by this temporary job; permanent workflow corrections use owner API.

on:
  push:
    branches:
      - staging/file00-1.2.18-hostinger-acceptance
    paths:
      - .github/workflows/file00-sixth-review-one-shot.yml

permissions:
  contents: write

jobs:
  apply-ten-rounds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/file00-1.2.18-hostinger-acceptance
          fetch-depth: 0
      - name: Configure review commit identity
        run: |
          git config user.name "File 00 Review Bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Prepare non-workflow final applicator
        run: |
          python3 tools/file00_sixth_review_round10_patch.py
          python3 tools/file00_sixth_review_version_patch.py
          python3 tools/file00_sixth_review_pushable_patch.py
          python3 -c "compile(open('tools/file00_sixth_review_final.py', encoding='utf-8').read(), 'tools/file00_sixth_review_final.py', 'exec')"
      - name: Apply reviewed non-workflow corrections
        run: python3 tools/file00_sixth_review_final.py
      - name: Push reviewed commits
        run: git push origin HEAD:staging/file00-1.2.18-hostinger-acceptance

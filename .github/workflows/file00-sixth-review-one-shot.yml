name: File 00 Sixth Fresh Ten-Round Corrective Applicator

on:
  push:
    branches:
      - staging/file00-1.2.18-hostinger-acceptance
    paths:
      - .github/workflows/file00-sixth-review-one-shot.yml

permissions:
  contents: write

jobs:
  apply-ten-rounds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/file00-1.2.18-hostinger-acceptance
          fetch-depth: 0
      - name: Apply ten fresh review fix retest rounds
        run: python3 tools/file00_sixth_review_apply.py
      - name: Push reviewed commits
        run: git push origin HEAD:staging/file00-1.2.18-hostinger-acceptance

name: File 00 Sixth Fresh Ten-Round Corrective Applicator

on:
  push:
    branches:
      - staging/file00-1.2.18-hostinger-acceptance
    paths:
      - .github/workflows/file00-sixth-review-one-shot.yml

permissions:
  contents: write

jobs:
  apply-ten-rounds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/file00-1.2.18-hostinger-acceptance
          fetch-depth: 0
      - name: Apply ten fresh review fix retest rounds
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "File 00 Review Bot"
          git config user.email "actions@users.noreply.github.com"
          python3 <<'PY'
          from pathlib import Path
          import json, re, subprocess, hashlib

          ROOT = Path('.')
          BRANCH = 'staging/file00-1.2.18-hostinger-acceptance'
          ADV = ROOT/'source/sabri-membership-core/includes/class-smc-advanced-trust-2026.php'
          STAGE_DOC = ROOT/'docs/HOSTINGER-STAGING-ACCEPTANCE-1.2.18.md'
          STAGE_MANIFEST = ROOT/'qa/hostinger-staging-acceptance-manifest.json'

          def run(*args):
              subprocess.run(args, check=True)

          def commit(message):
              run('git','add','-A')
              if subprocess.run(['git','diff','--cached','--quiet']).returncode == 0:
                  raise SystemExit('Expected changes missing for: '+message)
              run('git','commit','-m',message)

          def replace_once(path, old, new):
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one match in {path}: {old[:80]!r}; got {text.count(old)}')
              path.write_text(text.replace(old,new,1),encoding='utf-8')

          def insert_before(path, marker, addition):
              text=path.read_text(encoding='utf-8')
              if marker not in text: raise SystemExit(f'Marker not found in {path}: {marker}')
              path.write_text(text.replace(marker,addition+marker,1),encoding='utf-8')

          # ---------- Round 1: governing staging inventory ----------
          manifest = json.loads(STAGE_MANIFEST.read_text(encoding='utf-8'))
          manifest['candidate_matrix']['file08'] = {
              'ref':'pull/6','sha':'97a6e3861306c119c3250d5881675d80691f9309','version':'1.0.0',
              'required':True,'source_ref_status':'pinned','package_identity_state':'stale_receipt_pending_refresh'
          }
          manifest['candidate_matrix']['file12'] = {
              'ref':'pull/2','sha':'1ddc48e0271c896f32dbaa6d53a41711c22031ed','version':'0.2.0',
              'required':True,'source_ref_status':'pinned','artifact_id':8738191320,
              'artifact_wrapper_sha256':'6eac003469a811ba7caa7cdabbc2ca6bd2e0e3fdaf2d43a17bac474ebdadae51',
              'package_identity_state':'artifact_wrapper_pinned_inner_zip_pending'
          }
          manifest['candidate_matrix']['file18'] = {
              'ref':'pull/3','sha':'60191944dde0bb7df5e2057ba462d747883f8717','version':'2.1.0',
              'required':True,'source_ref_status':'pinned','package_sha256':'17a9d7dc35137341fe14cfc84ac78987da74f9e4ee585e44bc0f673552b4b58f',
              'package_identity_state':'stale_head_receipt_pending_refresh'
          }
          manifest['required_file00_plan_integrations']=['02','03','08','09','12','17','18','19','20','21','22','23','24','25']
          manifest['mandatory_unpinned_companions']=[]
          manifest['candidate_source_pinning_status']='complete_for_file00_plan_named_integrations'
          manifest['package_pinning_status']='partial_pending_external_artifact_receipts'
          STAGE_MANIFEST.write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          text=STAGE_DOC.read_text(encoding='utf-8')
          start=text.index('## Exact candidate matrix')
          end=text.index('## File 00 package identity')
          matrix='''## Exact candidate matrix\n\n| File | Candidate to stage | Evidence state | Staging instruction |\n|---|---|---|---|\n| 00 Membership Core | `main` `3a84c32a6ddad151f2ed09d244fa8aa536a58108`, runtime `1.2.18` | merged; exact-main QA green | mandatory |\n| 01 Platform Foundation | PR #3 `ad34ecf316261666769d33a8ce3acac9c019ab73`, `2.0.0` | exact-head QA/package candidate | mandatory current candidate |\n| 02 Authentication | PR #7 `c895ec17c631e6a28c86aa659bf947f9d326dc4d`, `1.2.0` | exact-head QA/package candidate; governing-plan freshness reviewed separately | mandatory auth dependency |\n| 03 Profiles & Doctors | `main` `0db6161b7f8906e65387f1db9bb4fc6f215d00ef`, `1.0.0-rc3` | merged candidate | mandatory |\n| 08 Clinic & Appointments | PR #6 `97a6e3861306c119c3250d5881675d80691f9309`, `1.0.0` | source candidate; exact-head drift review follows | mandatory |\n| 09 Doctor Verification | PR #6 `f58b04f4282c1f907a9cf3043d2f9394fbccd640`, `1.2.0-rc3` | exact-head QA/package candidate | mandatory |\n| 12 PDF Library | PR #2 `1ddc48e0271c896f32dbaa6d53a41711c22031ed`, `0.2.0` | corrective QA-green candidate | mandatory |\n| 17 Communication Network | `main` `c4bb3d399b309d6f7f4f77f8bb376df25ccad558`, `2.0.3` | merged | mandatory |\n| 18 Marketplace | PR #3 `60191944dde0bb7df5e2057ba462d747883f8717`, `2.1.0` | source candidate; exact-head drift review follows | mandatory |\n| 19 Notifications | `main` `5cb83d399f35ae1636415fb83373b6ba282e3685`, `3.0.0` | merged; QA green | mandatory |\n| 20 Unified Shell | `main` `178606ed1599c88dce7ef45cb69e2e90081cd519`, `1.4.3` | merged; QA green | mandatory |\n| 21 Home/News | `main` `ac83c987ab39d599ec4f5f092f1a1dedcaeaa1ee`, package/runtime `1.0.5/1.0.3` | merged | mandatory |\n| 22 Composer | PR #24 `ce3dc881395cf22e5b33a538cbb7e104d1a51931`, `1.0.0-rc.2` | exact-head QA/package candidate | mandatory |\n| 23 Publishing Dashboard | `main` `a8a8c805f4730998ccb44bd95c87591836561759`, `1.2.0` | merged | mandatory |\n| 24 Security/Privacy | `main` `3c5ea8ef342983630a7973274d3409c34409f86c`, `0.99.0` schema `0.25.5` | merged repository candidate | mandatory assurance plane |\n| 25 Visual Experience | PR #1 `64ccd17ca7c2055dd7f31365a91861b6aa28139c`, `0.14.0` | exact-head QA artifact | mandatory |\n\nAll File 00-plan-named integrations are now represented. Source-ref pinning is not package acceptance: every staged package still requires exact ZIP/checksum/manifest evidence before PASS.\n\n'''
          STAGE_DOC.write_text(text[:start]+matrix+text[end:],encoding='utf-8')
          commit('Review 1: restore complete File 00 staging integration inventory')

          # ---------- Round 2: exact-head drift ----------
          manifest=json.loads(STAGE_MANIFEST.read_text(encoding='utf-8'))
          manifest['candidate_matrix']['file08'].update({
              'sha':'6e9367430bc8f1ad956d4fe32b6223ba4eeb7727','version':'1.0.1','exact_head_ci_run':31100693352,
              'artifact_id':8967334843,'artifact_wrapper_sha256':'ab251525231fe09f0633374faabf5b4f3514035ac9ea62ae5cc645f83801fa56',
              'package_sha256':'54f639530807f945d4198913c1ce7da900a098339310fd8b97e4a33b8d7bb6f3',
              'package_identity_state':'exact_head_package_pinned','artifact_expires_at':'2026-09-05T12:16:56Z'
          })
          manifest['candidate_matrix']['file18'].update({
              'sha':'c402d872fd00a0400b4718e47c02cb9d404bcd9d','exact_head_ci_run':31202785221,
              'artifact_id':9003493144,'artifact_wrapper_sha256':'12017d3ea171462f0f8495b353ef8b19049f9545c9a2fa722bf9ae7bd900861c',
              'package_sha256':'17a9d7dc35137341fe14cfc84ac78987da74f9e4ee585e44bc0f673552b4b58f',
              'package_identity_state':'exact_head_package_pinned','artifact_expires_at':'2026-08-21T17:33:01Z'
          })
          STAGE_MANIFEST.write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          t=STAGE_DOC.read_text(encoding='utf-8')
          t=t.replace('PR #6 `97a6e3861306c119c3250d5881675d80691f9309`, `1.0.0` | source candidate; exact-head drift review follows',
                      'PR #6 `6e9367430bc8f1ad956d4fe32b6223ba4eeb7727`, `1.0.1` | exact-head CI `31100693352` green; ZIP `54f639…bb6f3`')
          t=t.replace('PR #3 `60191944dde0bb7df5e2057ba462d747883f8717`, `2.1.0` | source candidate; exact-head drift review follows',
                      'PR #3 `c402d872fd00a0400b4718e47c02cb9d404bcd9d`, `2.1.0` | exact-head CI `31202785221` green; ZIP `17a9d7…b58f`')
          STAGE_DOC.write_text(t,encoding='utf-8')
          commit('Review 2: correct drifting File 08 and File 18 exact-head package receipts')

          # ---------- Round 3: newer File 02 governing plan than source candidate ----------
          manifest=json.loads(STAGE_MANIFEST.read_text(encoding='utf-8'))
          f02=manifest['candidate_matrix']['file02']
          f02.update({
              'governing_plan_version':'2.2','governing_target_runtime':'1.3.0','staging_usable_for_final_integrated_acceptance':False,
              'blocker':'Latest approved File 02 v2.2 adds the 24-feature 1.3.0 authentication scope; repository search found no matching 1.3.0 candidate. Preserve passkey-assurance v1 compatibility but do not treat 1.2.0 as current-plan staging acceptance.'
          })
          manifest['preflight_status']='blocked_waiting_for_current_file02_1.3.0_candidate'
          STAGE_MANIFEST.write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          insert_before(STAGE_DOC,'## Gate A — Environment and immutable evidence',
              '## Preflight blocker — File 02 governing-plan freshness\n\nThe latest approved File 02 plan is v2.2 and defines an additive `1.3.0` scope with 24 modern authentication enhancements while preserving File 00 passkey-assurance v1 compatibility. No matching File 02 `1.3.0` repository candidate was found during this review. Therefore PR #7 `1.2.0` remains useful compatibility evidence but is **not sufficient for final integrated staging acceptance**. File 00 staging must remain BLOCKED at preflight until a current-plan File 02 candidate is exact-head QA/package pinned.\n\n')
          commit('Review 3: fail closed on newer File 02 governing plan without matching candidate')

          # ---------- Round 4: staging packet had no executable contract ----------
          contract = r'''import fs from 'node:fs';
          const manifest=JSON.parse(fs.readFileSync('qa/hostinger-staging-acceptance-manifest.json','utf8'));
          const required=['00','01','02','03','08','09','12','17','18','19','20','21','22','23','24','25'];
          const actual=Object.keys(manifest.candidate_matrix).map(k=>k.replace(/^file/,'')).sort((a,b)=>Number(a)-Number(b));
          const expected=[...required].sort((a,b)=>Number(a)-Number(b));
          const fail=(m)=>{console.error('FAIL '+m);process.exitCode=1;};
          const ok=(m)=>console.log('PASS '+m);
          JSON.stringify(actual)===JSON.stringify(expected)?ok('exact File 00 staging candidate set'):fail('candidate set mismatch '+actual.join(','));
          for(const id of required){const c=manifest.candidate_matrix['file'+id]; if(!c){fail('missing '+id);continue;} /^[0-9a-f]{40}$/.test(c.sha||'')?ok('File '+id+' exact SHA'):fail('File '+id+' invalid SHA'); if(c.required!==true)fail('File '+id+' not mandatory');}
          const planReq=[...(manifest.required_file00_plan_integrations||[])].sort((a,b)=>Number(a)-Number(b));
          JSON.stringify(planReq)===JSON.stringify(required.filter(x=>x!=='00'&&x!=='01').sort((a,b)=>Number(a)-Number(b)))?ok('plan integration set complete'):fail('plan integration inventory stale');
          const allowed=new Set(['pending','pass','fail','blocked']);
          for(const [k,v] of Object.entries(manifest.gates||{})){if(!allowed.has(v))fail('invalid gate state '+k+': '+v);}
          const external=manifest.external_status||{};
          if(external.staging_accepted||external.live_deployed||external.operational)fail('external status cannot be true in repository-only packet'); else ok('external status remains evidence-gated');
          const f02=manifest.candidate_matrix.file02;
          if(f02.governing_plan_version==='2.2' && f02.staging_usable_for_final_integrated_acceptance!==false)fail('File 02 plan/code freshness must fail closed'); else ok('File 02 current-plan blocker encoded');
          if(manifest.package_pinning_status==='complete'){
            for(const id of required){if(!manifest.candidate_matrix['file'+id].package_sha256)fail('package completeness falsely claimed for File '+id);}
          } else ok('partial package pinning truthfully represented');
          const doc=`docs/HOSTINGER-STAGING-ACCEPTANCE-${manifest.release}.md`;
          if(!fs.existsSync(doc))fail('release-matched staging document missing: '+doc); else {const d=fs.readFileSync(doc,'utf8'); for(const id of required){if(!d.includes('| '+id+' '))fail('staging doc missing File '+id);} if(!d.includes('Preflight blocker — File 02 governing-plan freshness'))fail('File 02 blocker absent from staging doc'); else ok('staging document synchronized');}
          if(process.exitCode) process.exit(1);
          '''
          (ROOT/'qa/hostinger-staging-acceptance-contract.mjs').write_text(contract.replace('          ','')+'\n',encoding='utf-8')
          pkg=json.loads((ROOT/'package.json').read_text(encoding='utf-8'))
          if 'hostinger-staging-acceptance-contract.mjs' not in pkg['scripts']['test']:
              pkg['scripts']['test'] += ' && node qa/hostinger-staging-acceptance-contract.mjs'
          (ROOT/'package.json').write_text(json.dumps(pkg,indent=2)+'\n',encoding='utf-8')
          run('node','qa/hostinger-staging-acceptance-contract.mjs')
          commit('Review 4: add executable staging packet and candidate-ledger contract')

          # ---------- Round 5: retired mutator workflow still remained ----------
          sentinel=ROOT/'.github/workflows/apply-fresh-ten-review.yml'
          if not sentinel.exists(): raise SystemExit('Retired sentinel unexpectedly absent before Review 5')
          sentinel.unlink()
          for wf in [ROOT/'.github/workflows/file00-three-plan-qa.yml',ROOT/'.github/workflows/cf01-contract.yml']:
              txt=wf.read_text(encoding='utf-8')
              marker='      - name: Install QA dependency\n'
              guard='''      - name: Enforce final workflow allowlist\n        shell: bash\n        run: |\n          set -euo pipefail\n          mapfile -t flows < <(find .github/workflows -maxdepth 1 -type f -printf '%f\\n' | sort)\n          expected=(cf01-contract.yml file00-three-plan-qa.yml)\n          test "${flows[*]}" = "${expected[*]}"\n          ! grep -R --line-number --include='*.yml' --include='*.yaml' 'contents: write' .github/workflows\n\n'''
              if 'Enforce final workflow allowlist' not in txt:
                  if marker not in txt: raise SystemExit('workflow insertion marker missing: '+str(wf))
                  txt=txt.replace(marker,guard+marker,1)
              wf.write_text(txt,encoding='utf-8')
          commit('Review 5: remove retired mutator workflow and enforce two-workflow allowlist')

          # ---------- Round 6: staging branch pushes were not first-class CI triggers ----------
          for wf in [ROOT/'.github/workflows/file00-three-plan-qa.yml',ROOT/'.github/workflows/cf01-contract.yml']:
              txt=wf.read_text(encoding='utf-8')
              if "          - 'staging/**'" not in txt:
                  needle="          - 'codex/**'\n"
                  if needle not in txt: raise SystemExit('codex branch trigger not found: '+str(wf))
                  txt=txt.replace(needle,needle+"          - 'staging/**'\n",1)
              wf.write_text(txt,encoding='utf-8')
          commit('Review 6: make staging branch exact-head pushes mandatory CI inputs')

          # ---------- helper for runtime regressions introduced from Round 7 ----------
          def make_sixth_test_base():
              src=(ROOT/'qa/fifth-fresh-review-runtime.php').read_text(encoding='utf-8')
              src=src.replace('$meta=[];$options=[];$filters=[];$actions=[];$apps=[];$caps=[1=>[\'manage_options\'=>true,\'smc_manage_membership\'=>true,\'smc_finalize_verification\'=>true],2=>[\'manage_options\'=>true,\'smc_manage_membership\'=>true,\'smc_finalize_verification\'=>true]];$current_user_id=1;$guardian_id=11;',
                              '$meta=[];$options=[];$filters=[];$actions=[];$apps=[];$contract_states=[];$caps=[1=>[\'manage_options\'=>true,\'smc_manage_membership\'=>true,\'smc_finalize_verification\'=>true],2=>[\'manage_options\'=>true,\'smc_manage_membership\'=>true,\'smc_finalize_verification\'=>true],3=>[\'manage_options\'=>false,\'smc_manage_membership\'=>true,\'smc_finalize_verification\'=>true]];$current_user_id=1;$guardian_id=11;')
              src=src.replace("class SMC_Security{public static $verified=true;static function session_is_verified($id){return self::$verified;}static function session_verified_at($id){return self::$verified?time()-60:0;}static function revoke_all_sessions($id,$r=''){return true;}static function audit($a,$id=0,$d=[]){return true;}",
                              "class SMC_Security{public static $verified=true;public static $audit_fail_action='';static function session_is_verified($id){return self::$verified;}static function session_verified_at($id){return self::$verified?time()-60:0;}static function revoke_all_sessions($id,$r=''){return true;}static function audit($a,$id=0,$d=[]){return self::$audit_fail_action!==$a;}")
              old="class SMC_Contracts{static function assertions($id){global $apps;$app=$apps[$id]??null;return ['application_exists'=>(bool)$app,'institutional_account'=>false,'status'=>'approved','approved'=>true,'suspended'=>false,'eligible'=>true,'identity_documents_current'=>true,'phone_verified'=>true,'email_verified'=>true,'guardian_verified'=>true,'professional_verified'=>true,'public_profile_allowed'=>true];}static function guardian_verified($id){return true;}}"
              new="class SMC_Contracts{static function assertions($id){global $apps,$contract_states;$app=$apps[$id]??null;$base=['application_exists'=>(bool)$app,'institutional_account'=>false,'status'=>'approved','approved'=>true,'suspended'=>false,'eligible'=>true,'identity_documents_current'=>true,'phone_verified'=>true,'email_verified'=>true,'guardian_verified'=>true,'professional_verified'=>true,'public_profile_allowed'=>true];return isset($contract_states[$id])?array_merge($base,$contract_states[$id]):$base;}static function guardian_verified($id){return true;}}"
              if old not in src: raise SystemExit('SMC_Contracts fifth-test stub changed unexpectedly')
              src=src.replace(old,new,1)
              src=src.replace("echo 'Fifth fresh runtime: '.(count($T)-$fail).' PASS / '.$fail.\" FAIL\\n\";", "echo 'Sixth fresh runtime: '.(count($T)-$fail).' PASS / '.$fail.\" FAIL\\n\";")
              (ROOT/'qa/sixth-fresh-review-runtime.php').write_text(src,encoding='utf-8')

          def append_sixth(block):
              p=ROOT/'qa/sixth-fresh-review-runtime.php'; s=p.read_text(encoding='utf-8'); marker='\n$fail=0;'
              if marker not in s: raise SystemExit('sixth test terminal marker missing')
              p.write_text(s.replace(marker,'\n'+block+'\n$fail=0;',1),encoding='utf-8')

          # ---------- Round 7: delegated principal could remain authorized after suspension ----------
          old='''\tpublic static function has_delegated_scope( $principal_user_id, $scope ) {\n\t\t$principal_user_id = absint( $principal_user_id );\n\t\t$scope = sanitize_key( $scope );\n\t\tif ( $principal_user_id <= 0 || ! self::protected_actions_allowed( $principal_user_id ) ) { return false; }\n\t\tforeach ( self::delegated_authorities( $principal_user_id ) as $grant ) {\n\t\t\tif ( in_array( $scope, (array) ( $grant['scopes'] ?? array() ), true ) ) { return true; }\n\t\t}\n\t\treturn false;\n\t}\n'''
          new='''\tpublic static function has_delegated_scope( $principal_user_id, $scope ) {\n\t\t$principal_user_id = absint( $principal_user_id );\n\t\t$scope = sanitize_key( $scope );\n\t\tif ( $principal_user_id <= 0 || ! self::protected_actions_allowed( $principal_user_id ) ) { return false; }\n\t\t$membership = class_exists( 'SMC_Contracts' ) ? SMC_Contracts::assertions( $principal_user_id ) : array();\n\t\tif ( empty( $membership['approved'] ) || ! empty( $membership['suspended'] ) || empty( $membership['eligible'] ) ) { return false; }\n\t\tforeach ( self::delegated_authorities( $principal_user_id ) as $grant ) {\n\t\t\tif ( in_array( $scope, (array) ( $grant['scopes'] ?? array() ), true ) ) { return true; }\n\t\t}\n\t\treturn false;\n\t}\n'''
          replace_once(ADV,old,new)
          make_sixth_test_base()
          append_sixth(r'''// Sixth R7: delegated principal must itself remain a current eligible File 00 member.\n$current_user_id=2;$d2=SMC_Advanced_Trust_2026::grant_delegated_authority(16,2,['membership_support'],time()+900);$current_user_id=1;t('sixth R7 delegation begins for current principal',is_array($d2)&&SMC_Advanced_Trust_2026::has_delegated_scope(16,'membership_support'));$contract_states[16]=['approved'=>false,'suspended'=>true,'eligible'=>false,'status'=>'suspended'];t('sixth R7 suspended principal loses delegated scope',!SMC_Advanced_Trust_2026::has_delegated_scope(16,'membership_support'));unset($contract_states[16]);''')
          run('php','-l',str(ADV)); run('php',str(ROOT/'qa/sixth-fresh-review-runtime.php'))
          commit('Review 7: revoke delegated scope when the principal membership is no longer current')

          # ---------- Round 8: stale custom capability could outlive base membership ----------
          old='''\tprivate static function actor_is_current( $actor_id, $capability = '', $founder_or_admin = false ) {\n\t\t$actor_id = absint( $actor_id );\n\t\tif ( $actor_id <= 0 ) { return false; }\n\t\tif ( function_exists( 'get_current_user_id' ) && get_current_user_id() > 0 && get_current_user_id() !== $actor_id ) { return false; }\n\t\tif ( $founder_or_admin && function_exists( 'smc_is_founder' ) && smc_is_founder( $actor_id ) ) { return true; }\n\t\treturn '' === $capability || current_user_can( $capability );\n\t}\n'''
          new='''\tprivate static function actor_is_current( $actor_id, $capability = '', $founder_or_admin = false ) {\n\t\t$actor_id = absint( $actor_id );\n\t\tif ( $actor_id <= 0 ) { return false; }\n\t\tif ( function_exists( 'get_current_user_id' ) && get_current_user_id() > 0 && get_current_user_id() !== $actor_id ) { return false; }\n\t\tif ( function_exists( 'smc_is_founder' ) && smc_is_founder( $actor_id ) ) { return true; }\n\t\t$is_admin = current_user_can( 'manage_options' );\n\t\tif ( $founder_or_admin && $is_admin ) { return true; }\n\t\tif ( ! $is_admin && class_exists( 'SMC_Contracts' ) ) {\n\t\t\t$membership = SMC_Contracts::assertions( $actor_id );\n\t\t\tif ( empty( $membership['approved'] ) || ! empty( $membership['suspended'] ) || empty( $membership['eligible'] ) || ! self::protected_actions_allowed( $actor_id ) ) { return false; }\n\t\t}\n\t\treturn '' === $capability || current_user_can( $capability );\n\t}\n'''
          replace_once(ADV,old,new)
          append_sixth(r'''// Sixth R8: a stale custom governance capability cannot override suspended File 00 membership.\n$current_user_id=3;$contract_states[3]=['approved'=>true,'suspended'=>false,'eligible'=>true];$govok=SMC_Advanced_Trust_2026::set_continuity_state(17,'dormant',3,'governance-current');t('sixth R8 current delegated governor accepted',is_array($govok));$contract_states[3]=['approved'=>false,'suspended'=>true,'eligible'=>false,'status'=>'suspended'];$govbad=SMC_Advanced_Trust_2026::set_continuity_state(18,'dormant',3,'governance-stale');t('sixth R8 suspended governor rejected despite stale WP capability',is_wp_error($govbad));unset($contract_states[3]);$current_user_id=1;''')
          run('php','-l',str(ADV)); run('php',str(ROOT/'qa/sixth-fresh-review-runtime.php'))
          commit('Review 8: bind non-institutional governance actors to current canonical membership')

          # ---------- Round 9: break-glass audit failure consumed request irreversibly ----------

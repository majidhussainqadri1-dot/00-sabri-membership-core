name: File 00 80-Review Round 1 Immediate Fix

on:
  push:
    branches:
      - audit/80-round-review-v1.2.40
    paths:
      - .github/workflows/zz-80-review-round1-fix.yml

permissions:
  contents: write

jobs:
  apply-round-1:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout review branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: audit/80-round-review-v1.2.40
          fetch-depth: 0
      - name: Apply residual MFA retirement correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('source/sabri-membership-core')

          p=root/'includes/class-smc-authorization.php'
          s=p.read_text()
          s=s.replace(''' * recovery allowlists, keeps public/safe reading available, and ensures that\n * Founder/Administrator institutional precedence never becomes a bypass for\n * an explicit hard block or a current two-factor challenge.\n''',''' * recovery allowlists, keeps public/safe reading available, and ensures that\n * Founder/Administrator institutional precedence never becomes a bypass for\n * an explicit hard block or a current membership/trust restriction.\n''')
          for action in ['smc_start_2fa','smc_finish_2fa','smc_challenge_2fa','smc_rotate_recovery']:
              s=s.replace("\t\t'"+action+"',\n",'')
          s=s.replace("empty( $assertions['effective_eligible'] ) || empty( $assertions['session_two_factor'] )","empty( $assertions['effective_eligible'] )")
          s=s.replace("smc_page_url( 'security', '/membership-security/' )","smc_page_url( 'status', '/membership-status/' )")
          s=s.replace('stale eligibility, containment/reverification hold, or current MFA gate.','stale eligibility or containment/reverification hold. File 00 MFA is retired.')
          s=s.replace('Explicit recovery actions remain available through the exact allowlist above.','Explicit membership recovery actions remain available through the exact allowlist above.')
          s=s.replace('Membership approval, current eligibility, and a current two-factor challenge are required.','Membership approval and current eligibility are required.')
          p.write_text(s)

          p=root/'includes/class-smc-completion.php'
          s=p.read_text()
          s=s.replace("\t\t\t'smc_challenge_2fa', 'smc_revoke_session', 'smc_revoke_all_sessions', 'smc_retry_repair', 'smc_retry_outbox',\n","\t\t\t'smc_revoke_session', 'smc_revoke_all_sessions', 'smc_retry_repair', 'smc_retry_outbox',\n")
          s=s.replace('Sabri Membership Safe Mode is active. Risky writes are temporarily blocked while status, recovery and scoped repair remain available.','Sabri Membership Safe Mode is active. Risky writes are temporarily blocked while status, session revocation and scoped repair remain available.')
          old='''\tprivate static function require_high_risk_authority() {\n\t\tif ( ! current_user_can( 'smc_manage_membership' ) || ! SMC_Security::session_is_verified( get_current_user_id() ) ) {\n\t\t\twp_die( esc_html__( 'A current two-factor session and membership-management capability are required.', 'sabri-membership-core' ), '', array( 'response' => 403 ) );\n\t\t}\n\t}\n\n\tprivate static function require_retention_authority() {\n\t\tif ( ! current_user_can( 'smc_manage_retention_holds' ) || ! SMC_Security::session_is_verified( get_current_user_id() ) ) {\n\t\t\twp_die( esc_html__( 'A current two-factor session and retention-hold capability are required.', 'sabri-membership-core' ), '', array( 'response' => 403 ) );\n\t\t}\n\t}\n'''
          new='''\tprivate static function current_trust_allows_high_risk_action() {\n\t\tif ( ! is_user_logged_in() || ! class_exists( 'SMC_MFA_Retirement' ) ) {\n\t\t\treturn false;\n\t\t}\n\t\treturn SMC_MFA_Retirement::advanced_trust_allows_without_mfa( get_current_user_id() );\n\t}\n\n\tprivate static function require_high_risk_authority() {\n\t\tif ( ! current_user_can( 'smc_manage_membership' ) || ! self::current_trust_allows_high_risk_action() ) {\n\t\t\twp_die( esc_html__( 'A current authenticated membership-management session with an active trust state is required.', 'sabri-membership-core' ), '', array( 'response' => 403 ) );\n\t\t}\n\t}\n\n\tprivate static function require_retention_authority() {\n\t\tif ( ! current_user_can( 'smc_manage_retention_holds' ) || ! self::current_trust_allows_high_risk_action() ) {\n\t\t\twp_die( esc_html__( 'A current authenticated retention-hold session with an active trust state is required.', 'sabri-membership-core' ), '', array( 'response' => 403 ) );\n\t\t}\n\t}\n'''
          if old not in s: raise SystemExit('completion authority block not found')
          s=s.replace(old,new)
          p.write_text(s)

          p=root/'includes/class-smc-workflow.php'
          s=p.read_text()
          s=s.replace("\t\tadd_shortcode( 'smc_membership_security', array( __CLASS__, 'security_shortcode' ) );\n",'')
          for action in ['start_2fa','finish_2fa','challenge_2fa','rotate_recovery','ack_recovery_receipt']:
              s=s.replace("\t\t\t\t'"+action+"',\n",'')
          for key in ['two_factor','challenge','recovery_saved','totp_format','totp_expired','totp_mismatch','totp_backend','totp_audit','totp_storage','totp_revalidate']:
              s=re.sub(r"\n\t\t\t'"+re.escape(key)+r"'\s*=>\s*array\([^\n]*\),",'',s)
          start=s.find("\n\t\tif ( 'totp_audit' === $key && current_user_can( 'manage_options' ) ) {")
          if start!=-1:
              end=s.find("\n\t\t}\n\t\treturn smc_notice", start)
              if end==-1: raise SystemExit('TOTP diagnostic block end not found')
              s=s[:start]+s[end+4:]
          pattern=r"\tpublic static function security_shortcode\(\) \{.*?\n\t\}\n\n\tprivate static function security_event_list"
          m=re.search(pattern,s,flags=re.S)
          if not m: raise SystemExit('security shortcode block not found')
          replacement='''\tpublic static function security_shortcode() {\n\t\t$required = self::login_required();\n\t\tif ( $required ) { return $required; }\n\t\t$user_id = get_current_user_id();\n\t\tob_start(); ?>\n\t\t<main class="smc-panel" aria-labelledby="smc-security-title"><h1 id="smc-security-title"><?php esc_html_e( 'Membership Security', 'sabri-membership-core' ); ?></h1><?php echo smc_notice( __( 'File 00 no longer uses two-factor authentication, authenticator codes or recovery codes. Normal sign-in and account recovery belong to Sabri Authentication (File 02).', 'sabri-membership-core' ), 'success' ); // phpcs:ignore WordPress.Security.EscapeOutput.OutputNotEscaped ?><p><?php esc_html_e( 'Membership session visibility and revocation remain available below.', 'sabri-membership-core' ); ?></p><?php self::session_list( $user_id ); ?><form method="post" action="<?php echo esc_url( admin_url( 'admin-post.php' ) ); ?>" class="smc-form"><input type="hidden" name="action" value="smc_revoke_all_sessions"><?php wp_nonce_field( 'smc_revoke_all_sessions', 'smc_nonce' ); ?><label class="smc-check"><input type="checkbox" name="confirm_revoke_all" value="1" required> <?php esc_html_e( 'I understand this signs out every device, including this one.', 'sabri-membership-core' ); ?></label><button class="smc-button smc-button--danger"><?php esc_html_e( 'Revoke All Sessions', 'sabri-membership-core' ); ?></button></form></main><?php return ob_get_clean();\n\t}\n\n\tprivate static function security_event_list'''
          s=s[:m.start()]+replacement+s[m.end():]
          s=s.replace('\tprivate static function session_list( $user_id ) {','\tpublic static function session_list( $user_id ) {')
          s=s.replace("if ( empty( $_POST['confirm_revoke_all'] ) || ! SMC_Security::session_is_verified( $user_id ) ) {","if ( empty( $_POST['confirm_revoke_all'] ) ) {")
          s=s.replace("if ( ! is_user_logged_in() || ! SMC_Security::session_is_verified( $user_id ) ) {\n\t\t\tauth_redirect();\n\t\t}","if ( ! is_user_logged_in() ) {\n\t\t\tauth_redirect();\n\t\t}")
          p.write_text(s)

          p=root/'includes/class-smc-mfa-retirement.php'
          s=p.read_text()
          old='''\tpublic static function security_shortcode() {\n\t\tif ( ! is_user_logged_in() ) { return smc_notice( __( 'Please sign in through Sabri Authentication to continue.', 'sabri-membership-core' ), 'warning' ); }\n\t\tob_start(); ?>\n\t\t<main class="smc-panel" aria-labelledby="smc-security-title"><h1 id="smc-security-title"><?php esc_html_e( 'Membership Security', 'sabri-membership-core' ); ?></h1><?php echo smc_notice( __( 'File 00 no longer uses two-factor authentication, authenticator codes or recovery codes. Your normal account sign-in and password recovery remain with Sabri Authentication (File 02).', 'sabri-membership-core' ), 'success' ); // phpcs:ignore WordPress.Security.EscapeOutput.OutputNotEscaped ?><p><?php esc_html_e( 'Membership eligibility, identity assurance, guardian consent, verification state, audit evidence, session revocation and access restrictions remain active.', 'sabri-membership-core' ); ?></p></main><?php return ob_get_clean();\n\t}\n'''
          new='''\tpublic static function security_shortcode() {\n\t\tif ( ! is_user_logged_in() ) { return smc_notice( __( 'Please sign in through Sabri Authentication to continue.', 'sabri-membership-core' ), 'warning' ); }\n\t\t$user_id = get_current_user_id();\n\t\tob_start(); ?>\n\t\t<main class="smc-panel" aria-labelledby="smc-security-title"><h1 id="smc-security-title"><?php esc_html_e( 'Membership Security', 'sabri-membership-core' ); ?></h1><?php echo smc_notice( __( 'File 00 no longer uses two-factor authentication, authenticator codes or recovery codes. Your normal account sign-in and password recovery remain with Sabri Authentication (File 02).', 'sabri-membership-core' ), 'success' ); // phpcs:ignore WordPress.Security.EscapeOutput.OutputNotEscaped ?><p><?php esc_html_e( 'Membership eligibility, identity assurance, guardian consent, verification state, audit evidence, session revocation and access restrictions remain active.', 'sabri-membership-core' ); ?></p><?php if ( class_exists( 'SMC_Workflow' ) && is_callable( array( 'SMC_Workflow', 'session_list' ) ) ) { SMC_Workflow::session_list( $user_id ); } ?><form method="post" action="<?php echo esc_url( admin_url( 'admin-post.php' ) ); ?>" class="smc-form"><input type="hidden" name="action" value="smc_revoke_all_sessions"><?php wp_nonce_field( 'smc_revoke_all_sessions', 'smc_nonce' ); ?><label class="smc-check"><input type="checkbox" name="confirm_revoke_all" value="1" required> <?php esc_html_e( 'I understand this signs out every device, including this one.', 'sabri-membership-core' ); ?></label><button class="smc-button smc-button--danger"><?php esc_html_e( 'Revoke All Sessions', 'sabri-membership-core' ); ?></button></form></main><?php return ob_get_clean();\n\t}\n'''
          if old not in s: raise SystemExit('retirement shortcode block not found')
          s=s.replace(old,new)
          p.write_text(s)

          p=root/'assets/membership.js'
          s=p.read_text()
          block="""\tconst copyRecovery = document.querySelector('[data-smc-copy-recovery]');\n\tconst printRecovery = document.querySelector('[data-smc-print-recovery]');\n\tconst recoveryFeedback = document.querySelector('[data-smc-recovery-feedback]');\n\tcopyRecovery?.addEventListener('click', async () => {\n\t\tconst codes = Array.from(document.querySelectorAll('#smc-recovery-codes code')).map((node) => node.textContent.trim()).filter(Boolean).join('\\n');\n\t\ttry { await navigator.clipboard.writeText(codes); if (recoveryFeedback) recoveryFeedback.textContent = 'Recovery codes copied. Keep them private.'; }\n\t\tcatch (error) { if (recoveryFeedback) recoveryFeedback.textContent = 'Automatic copy was unavailable. Select and copy the codes manually.'; }\n\t});\n\tprintRecovery?.addEventListener('click', () => window.print());\n\n"""
          if block not in s: raise SystemExit('recovery JS block not found')
          p.write_text(s.replace(block,''))
          PY
      - name: Verify immediate correction
        run: |
          set -euo pipefail
          php -l source/sabri-membership-core/includes/class-smc-authorization.php
          php -l source/sabri-membership-core/includes/class-smc-completion.php
          php -l source/sabri-membership-core/includes/class-smc-workflow.php
          php -l source/sabri-membership-core/includes/class-smc-mfa-retirement.php
          node --check source/sabri-membership-core/assets/membership.js
          ! grep -Eq 'session_is_verified|current two-factor|smc_challenge_2fa|smc_start_2fa|smc_finish_2fa|smc_rotate_recovery' source/sabri-membership-core/includes/class-smc-authorization.php
          ! grep -Eq 'session_is_verified|current two-factor|smc_challenge_2fa' source/sabri-membership-core/includes/class-smc-completion.php
          ! grep -Eq 'data-smc-copy-recovery|data-smc-print-recovery' source/sabri-membership-core/assets/membership.js
          git diff --check
      - name: Commit round 1 correction
        run: |
          set -euo pipefail
          git config user.name 'File 00 QA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add source/sabri-membership-core/includes/class-smc-authorization.php source/sabri-membership-core/includes/class-smc-completion.php source/sabri-membership-core/includes/class-smc-workflow.php source/sabri-membership-core/includes/class-smc-mfa-retirement.php source/sabri-membership-core/assets/membership.js
          git commit -m 'Round 1: eliminate residual active File 00 MFA gates'
          git push origin HEAD:audit/80-round-review-v1.2.40

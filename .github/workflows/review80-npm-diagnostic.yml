name: File 00 Review80 NPM Diagnostic

on:
  push:
    branches: [audit/80-round-review-v1.2.40]

permissions:
  contents: read

jobs:
  diagnose-npm:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none
          extensions: mysqli, openssl, mbstring, json
          tools: none
      - name: Install Node QA dependencies
        run: npm ci --ignore-scripts
      - { name: "01 run-tests", continue-on-error: true, run: "node qa/run-tests.mjs" }
      - { name: "02 audit legacy anchor contract", continue-on-error: true, run: "node qa/audit-legacy-anchor-contract.mjs" }
      - { name: "03 audit legacy anchor runtime", continue-on-error: true, run: "php qa/audit-legacy-anchor-runtime.php" }
      - { name: "04 all button action contract", continue-on-error: true, run: "node qa/all-button-action-contract.mjs" }
      - { name: "05 membership state contract", continue-on-error: true, run: "node qa/membership-state-contract.mjs" }
      - { name: "06 membership state runtime", continue-on-error: true, run: "php qa/membership-state-runtime.php" }
      - { name: "07 institutional lifecycle contract", continue-on-error: true, run: "node qa/institutional-lifecycle-contract.mjs" }
      - { name: "08 institutional lifecycle runtime", continue-on-error: true, run: "php qa/institutional-lifecycle-runtime.php" }
      - { name: "09 authorization boundary contract", continue-on-error: true, run: "node qa/authorization-boundary-contract.mjs" }
      - { name: "10 authorization boundary runtime", continue-on-error: true, run: "php qa/authorization-boundary-runtime.php" }
      - { name: "11 completion hardening contract", continue-on-error: true, run: "node qa/completion-hardening-contract.mjs" }
      - { name: "12 approval gate runtime", continue-on-error: true, run: "php qa/approval-gate-runtime.php" }

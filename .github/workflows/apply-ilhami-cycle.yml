name: Apply File 00 Ilhami cycle 1.2.6

on:
  pull_request:
    branches:
      - main
    paths:
      - 'tools/ilhami-overlay.part*'
      - 'tools/ilhami-overlay.trigger'
      - 'tools/ilhami-cycle.patch.part*'
      - 'tools/ilhami-cycle.trigger'
      - '.github/workflows/apply-ilhami-cycle.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'codex/file00-ilhami-cycle-1.2.6'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Ilhami-cycle branch
        uses: actions/checkout@v4
        with:
          ref: codex/file00-ilhami-cycle-1.2.6
          fetch-depth: 0

      - name: Reconstruct and apply reviewed overlay
        shell: bash
        run: |
          set -euo pipefail
          cat tools/ilhami-overlay.part* > /tmp/ilhami-overlay.tar.gz.b64
          base64 --decode /tmp/ilhami-overlay.tar.gz.b64 > /tmp/ilhami-overlay.tar.gz
          tar -tzf /tmp/ilhami-overlay.tar.gz >/dev/null
          tar -xzf /tmp/ilhami-overlay.tar.gz -C .
          rm -f tools/ilhami-overlay.part* tools/ilhami-overlay.trigger tools/ilhami-cycle.patch.part* tools/ilhami-cycle.trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'File 00 1.2.6: apply Ilhami zero-defect corrections'
          git push origin HEAD:codex/file00-ilhami-cycle-1.2.6

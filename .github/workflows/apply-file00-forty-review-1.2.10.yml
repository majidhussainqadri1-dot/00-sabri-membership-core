name: Apply File 00 1.2.10 Forty-Round Corrections

on:
  push:
    branches: ['codex/file00-forty-review-cycles-1.2.10']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: file00-1.2.10-corrective-application
  cancel-in-progress: false

jobs:
  apply-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none
          tools: none
      - name: Apply fail-closed corrective patch
        run: python3 tools/apply-forty-round-1.2.10.py
      - name: Install locked QA dependency
        run: npm ci --ignore-scripts
      - name: Verify corrected source and deterministic package
        run: npm run verify
      - name: Lint all PHP after correction
        run: |
          set -euo pipefail
          while IFS= read -r file; do php -l "$file"; done < <(find source qa -type f -name '*.php' -print | sort)
      - name: Commit verified corrective source
        run: |
          set -euo pipefail
          rm -f source/sabri-membership-core/MANIFEST.sha256
          rm -f dist/00-sabri-membership-core-1.2.10.zip
          git checkout -- dist/CHECKSUMS.sha256 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No corrective commit required.'
            exit 0
          fi
          git commit -m 'File 00 1.2.10: apply forty fresh review corrections'
          git push origin HEAD:${{ github.ref_name }}

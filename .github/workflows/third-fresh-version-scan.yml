name: Third Fresh Version Consistency Scan

on:
  push:
    branches: [codex/file00-third-fresh-ten-review-1.2.16]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Locate remaining 1.2.15 references
        run: |
          echo '=== QA ==='
          grep -RIn --exclude='*.json' '1\.2\.15' qa || true
          echo '=== PACKAGE / CURRENT DOCS / PLUGIN META ==='
          grep -In '1\.2\.15' package.json package-lock.json docs/FILE-00-MASTER-PLAN-2026.md source/sabri-membership-core/README.txt source/sabri-membership-core/sabri-membership-core.php || true

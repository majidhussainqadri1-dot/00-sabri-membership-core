name: File 00 Review80 Static Diagnostic

on:
  push:
    branches: [audit/80-round-review-v1.2.40]

permissions:
  contents: read

jobs:
  diagnose-static:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none
          extensions: mysqli, openssl, mbstring, json
          tools: none
      - name: Install Node QA dependencies
        run: npm ci --ignore-scripts
      - name: PHP source lint
        run: find source/sabri-membership-core -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Review80 runtime lint
        run: php -l qa/review80-wordpress-mysql.php
      - name: Full npm QA
        run: npm test
      - name: Git whitespace check
        run: git diff --check
      - name: Temporary workflow hygiene check
        run: test -z "$(find .github/workflows -maxdepth 1 -name 'zz-80-review-*' -print -quit)"

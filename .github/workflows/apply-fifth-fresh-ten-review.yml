name: Apply File 00 Fifth Fresh Ten-Review Corrections

on:
  push:
    branches: ['codex/file00-fifth-fresh-ten-review-1.2.18']

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[fifth-fresh-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/file00-fifth-fresh-ten-review-1.2.18
          fetch-depth: 0
      - name: Verify payload and apply corrections
        run: |
          set -euo pipefail
          echo '6bcdfa1af0f39c0ced9e572b9be4e20f7fe5f802b13eb8dd0f5940b2ad728cf5  tools/fifth-fresh-payload.part0' | sha256sum -c -
          echo '9a1c7c98ec8cd9c10ce9e56c9bfe80d8d77f2b5a6d3df30fabf9e60fff124a9a  tools/fifth-fresh-payload.part1' | sha256sum -c -
          echo '96d5774453453c63a982557acb2e55c38ae5164af96b4e516580b694deaedba2  tools/fifth-fresh-payload.part2' | sha256sum -c -
          echo '4e2d0b51b165533a2e1fab818ccd17b71cd0029ad3973ebfcc390898e9b2f842  tools/fifth-fresh-payload.part3' | sha256sum -c -
          cat tools/fifth-fresh-payload.part0 tools/fifth-fresh-payload.part1 tools/fifth-fresh-payload.part2 tools/fifth-fresh-payload.part3 > /tmp/fifth.b64
          echo 'c8c1271d2506b7bc3fa0eb53fa6ab0ecf03e1c9f9f04e484e145320b5952d4b6  /tmp/fifth.b64' | sha256sum -c -
          base64 -d /tmp/fifth.b64 | gzip -d > tools/apply-fifth-fresh-ten-review.py
          rm -f tools/apply-fifth-fresh-ten-review.py.gz.b64 tools/fifth-fresh-payload.part0 tools/fifth-fresh-payload.part1 tools/fifth-fresh-payload.part2 tools/fifth-fresh-payload.part3
          python3 tools/apply-fifth-fresh-ten-review.py
          git diff --check
      - name: Commit corrected release
        run: |
          set -euo pipefail
          # The helper is intentionally not allowed to push workflow-file mutations.
          # Those final read-only workflow updates are applied separately through the connector.
          git checkout HEAD -- .github/workflows/cf01-contract.yml .github/workflows/file00-three-plan-qa.yml .github/workflows/apply-fifth-fresh-ten-review.yml
          git config user.name 'majidhussainqadri1-dot'
          git config user.email 'majidhussainqadri1@gmail.com'
          git add -A
          git commit -m 'File 00 1.2.18 fifth fresh ten-round corrective closure [fifth-fresh-applied]'
          git push origin HEAD:codex/file00-fifth-fresh-ten-review-1.2.18

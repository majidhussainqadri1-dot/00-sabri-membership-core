name: File 00 CF-01 and Forty-Round Contract Integrity

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

jobs:
  contract-integrity:
    name: PHP ${{ matrix.php }} contract, package and forty-round suites
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - name: Checkout exact immutable head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: Public repository and Git integrity
        run: |
          set -euo pipefail
          git diff --check
          test ! -f .gitmodules
          if git ls-files -s | awk '$1 == "120000" { found=1 } END { exit !found }'; then exit 1; fi
          if grep -RIl --exclude-dir=.git '^version https://git-lfs.github.com/spec/v1$' . | grep -q .; then exit 1; fi
          test "$(sha256sum 'source-archive/00 sabri-membership-core-1.0.1.zip' | awk '{print $1}')" = "1418dff3410ebd66f6d440453f4bc4fe487828920d8fdaf8190df42844d426af"
          test "$(stat -c '%s' 'source-archive/00 sabri-membership-core-1.0.1.zip')" = "59278"
          python3 - <<'PY'
          import pathlib, re
          approved='source-archive/00 sabri-membership-core-1.0.1.zip'
          forbidden=('.zip','.tar','.tgz','.gz','.7z','.rar','.env','.pem','.p12','.pfx','.key')
          patterns=[rb'-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----',rb'\bgh[pousr]_[A-Za-z0-9]{20,}\b',rb'\bAKIA[0-9A-Z]{16}\b']
          for p in pathlib.Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or 'dist' in p.parts or p.as_posix()==approved: continue
              if p.name.lower().startswith('.env') or p.as_posix().lower().endswith(forbidden): raise SystemExit(f'forbidden artifact: {p}')
              data=p.read_bytes()
              if any(re.search(pattern,data) for pattern in patterns): raise SystemExit(f'possible secret: {p}')
          PY
      - name: Install locked Node test dependency
        run: npm ci --ignore-scripts
      - name: Enforce declared PHP 7.4 compatibility
        run: |
          if grep -RInE --include='*.php' '\b(str_contains|str_starts_with|str_ends_with|array_is_list|get_debug_type)\s*\(' source qa; then exit 1; fi
      - name: Lint all plugin and runtime-test PHP
        run: |
          set -euo pipefail
          mapfile -t php_files < <(find source qa -type f -name '*.php' -print | sort)
          test "${#php_files[@]}" -ge 15
          for file in "${php_files[@]}"; do php -l "$file"; done
      - name: Run inherited, CF-01 and forty-round suites
        run: npm test
      - name: Build and verify deterministic 1.2.12 package
        run: npm run verify

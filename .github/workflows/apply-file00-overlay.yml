name: Apply File 00 1.2.5 completion overlay

on:
  push:
    branches:
      - codex/file00-completion-hardening-1.2.5-final
    paths:
      - 'tools/file00-overlay.part*'
      - '.github/workflows/apply-file00-overlay.yml'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.head_ref == 'codex/file00-completion-hardening-1.2.5-final'
    runs-on: ubuntu-latest
    steps:
      - name: Check out completion branch
        uses: actions/checkout@v4
        with:
          ref: codex/file00-completion-hardening-1.2.5-final
          fetch-depth: 0

      - name: Reconstruct and apply reviewed overlay
        shell: bash
        run: |
          set -euo pipefail
          cat tools/file00-overlay.part* > /tmp/file00-overlay.b64
          base64 --decode /tmp/file00-overlay.b64 > /tmp/file00-overlay.tar.gz
          tar -tzf /tmp/file00-overlay.tar.gz >/dev/null
          tar -xzf /tmp/file00-overlay.tar.gz -C .
          sed -i 's/[[:space:]]\+$//' docs/COMPLETION-HARDENING-AUDIT-1.2.5.md docs/FILE-00-IMPLEMENTATION-TRACEABILITY-1.2.5.md
          git checkout -- .github/workflows/file00-1.2.1-qa.yml
          rm -f tools/file00-overlay.part* .github/workflows/apply-file00-overlay.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'File 00 1.2.5: apply completion hardening overlay'
          git push origin HEAD:codex/file00-completion-hardening-1.2.5-final

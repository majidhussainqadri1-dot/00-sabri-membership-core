name: File 00 to File 02 Account Contract

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**

permissions:
  contents: read

jobs:
  account-contract:
    name: PHP ${{ matrix.php }} account contract v1.1.0
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php:
          - '7.4'
          - '8.1'
          - '8.3'
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: Lint providers and run no-network policy suites
        run: |
          set -euo pipefail
          php -l source/sabri-membership-core/sabri-membership-core.php
          php -l source/sabri-membership-core/includes/class-smc-authentication-contract.php
          php -l source/sabri-membership-core/includes/class-smc-authentication-contract-v11.php
          php -l qa/authentication-account-contract-runtime.php
          php -l qa/authentication-account-contract-v11.php
          php qa/authentication-account-contract-runtime.php
          php qa/authentication-account-contract-v11.php
          node qa/authentication-account-contract.mjs
          git diff --check

          grep -Fq "define( 'SMC_AUTHENTICATION_CONTRACT_VERSION', '1.1.0' );" source/sabri-membership-core/sabri-membership-core.php
          grep -Fq "define( 'SMC_AUTHENTICATION_CONTRACT_V11_VERSION', '1.1.0' );" source/sabri-membership-core/sabri-membership-core.php
          grep -Fq "class SMC_Authentication_Contract_V11" source/sabri-membership-core/includes/class-smc-authentication-contract-v11.php
          grep -Eq "CONTRACT_VERSION[[:space:]]*=[[:space:]]*'1\.1\.0'" source/sabri-membership-core/includes/class-smc-authentication-contract-v11.php
          grep -Fq "ethical_conduct_version" source/sabri-membership-core/includes/class-smc-authentication-contract-v11.php
          grep -Fq "profile_photo_required" source/sabri-membership-core/includes/class-smc-authentication-contract-v11.php
          grep -Fq "smc_profile_photo_complete" source/sabri-membership-core/includes/class-smc-authentication-contract-v11.php
          grep -Fq "SMC_Security::encrypt" source/sabri-membership-core/includes/class-smc-authentication-contract-v11.php
          grep -Fq "SMC_Security::decrypt" source/sabri-membership-core/includes/class-smc-authentication-contract-v11.php
          ! grep -E "(access_token|refresh_token|client_secret|BEGIN .*PRIVATE KEY)" source/sabri-membership-core/includes/class-smc-authentication-contract-v11.php

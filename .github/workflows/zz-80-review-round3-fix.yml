name: File 00 80-Review Round 3 Immediate Fix

on:
  push:
    branches: [audit/80-round-review-v1.2.40]
    paths: [.github/workflows/zz-80-review-round3-fix.yml]

permissions:
  contents: write

jobs:
  apply-round-3:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: audit/80-round-review-v1.2.40
          fetch-depth: 0
      - name: Remove retired fallback actions and dead mutator handlers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('source/sabri-membership-core')
          p=root/'includes/class-smc-host-compat.php'; s=p.read_text()
          for name in ['start_2fa','finish_2fa','challenge_2fa','rotate_recovery','ack_recovery_receipt']:
              s=re.sub(r"\n\t\t\t'"+name+r"'\s*=>\s*array\([^\n]*\),",'',s)
          p.write_text(s)

          p=root/'includes/class-smc-workflow.php'; s=p.read_text()
          s,n=re.subn(r"\n\tpublic static function handle_start_2fa\(\) \{.*?(?=\n\tpublic static function handle_revoke_session\(\))",'',s,flags=re.S)
          if n != 1: raise SystemExit(f'retired MFA handler block removal count={n}')
          s,n=re.subn(r"\n\tprivate static function store_recovery_receipt\(.*?(?=\n\tpublic static function handle_verify_guardian\(\))",'',s,flags=re.S)
          if n != 1: raise SystemExit(f'retired recovery helper block removal count={n}')
          p.write_text(s)

          p=Path('qa/mfa-retirement-contract.mjs'); s=p.read_text()
          if "const hostCompat" not in s:
              s=s.replace("const schemaCompat = fs.readFileSync(`${root}/includes/class-smc-schema-compat.php`, 'utf8');", "const schemaCompat = fs.readFileSync(`${root}/includes/class-smc-schema-compat.php`, 'utf8');\nconst hostCompat = fs.readFileSync(`${root}/includes/class-smc-host-compat.php`, 'utf8');\nconst workflow = fs.readFileSync(`${root}/includes/class-smc-workflow.php`, 'utf8');")
              marker="for (const action of ['start_2fa', 'finish_2fa', 'challenge_2fa', 'rotate_recovery', 'ack_recovery_receipt']) {\n  has(retirement, `remove_action( 'admin_post_smc_' . $action`, `runtime removal for ${action}`);\n}\n"
              extra=marker+"for (const action of ['start_2fa', 'finish_2fa', 'challenge_2fa', 'rotate_recovery', 'ack_recovery_receipt']) {\n  lacks(hostCompat, `'${action}'`, `host fallback registry excludes retired ${action}`);\n}\nfor (const handler of ['handle_start_2fa', 'handle_finish_2fa', 'handle_challenge_2fa', 'handle_rotate_recovery', 'handle_ack_recovery_receipt']) {\n  lacks(workflow, `function ${handler}`, `dead retired handler removed: ${handler}`);\n}\n"
              if marker not in s: raise SystemExit('MFA contract insertion marker missing')
              s=s.replace(marker,extra)
          p.write_text(s)
          PY
      - name: Verify round 3 correction
        run: |
          set -euo pipefail
          php -l source/sabri-membership-core/includes/class-smc-host-compat.php
          php -l source/sabri-membership-core/includes/class-smc-workflow.php
          node qa/mfa-retirement-contract.mjs
          ! grep -Eq "handle_(start_2fa|finish_2fa|challenge_2fa|rotate_recovery|ack_recovery_receipt)|'start_2fa'|'finish_2fa'|'challenge_2fa'|'rotate_recovery'|'ack_recovery_receipt'" source/sabri-membership-core/includes/class-smc-host-compat.php source/sabri-membership-core/includes/class-smc-workflow.php
          git diff --check
      - name: Commit immediate round 3 correction
        run: |
          git config user.name 'File 00 QA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add source/sabri-membership-core/includes/class-smc-host-compat.php source/sabri-membership-core/includes/class-smc-workflow.php qa/mfa-retirement-contract.mjs
          git commit -m 'Round 3: remove retired MFA fallback and dead mutator surface'
          git push origin HEAD:audit/80-round-review-v1.2.40
